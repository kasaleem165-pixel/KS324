{% extends "base.html" %}
{% block content %}
<div class="card">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
    <h2 style="margin:0;">Customers</h2>
    <a href="/customers/add" class="btn btn-primary">+ Add Customer</a>
  </div>
  <table>
    <thead><tr>
      <th>Name</th><th>Phone</th><th>Address</th><th></th>
    </tr></thead>
    <tbody>
    {% for c in customers %}
    <tr>
      <td><strong>{{ c.name }}</strong></td>
      <td>{{ c.phone or '-' }}</td>
      <td>{{ c.address or '-' }}</td>
      <td>
        <a href="/customers/{{ c.id }}" class="btn btn-primary btn-sm">View Ledger</a>
        <a href="/customers/{{ c.id }}/payment" class="btn btn-success btn-sm" style="margin-left:6px;">+ Payment</a>
      </td>
    </tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
