{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:480px; margin:0 auto;">
  <h2>Add Customer</h2>
  <form method="POST">
    <div style="display:flex; flex-direction:column; gap:14px;">
      <div class="form-group">
        <label>Customer Name *</label>
        <input name="name" required placeholder="e.g. Sajid Bhai">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input name="phone" placeholder="0300-0000000">
      </div>
      <div class="form-group">
        <label>Address</label>
        <textarea name="address" rows="2" placeholder="Optional"></textarea>
      </div>
      <div style="display:flex; gap:12px; margin-top:6px;">
        <button type="submit" class="btn btn-primary">Add Customer</button>
        <a href="/customers" class="btn" style="background:#e2e8f0; color:#444;">Cancel</a>
      </div>
    </div>
  </form>
</div>
{% endblock %}
