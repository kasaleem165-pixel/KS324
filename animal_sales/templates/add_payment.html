{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:480px; margin:0 auto;">
  <h2>Record Payment — {{ customer.name }}</h2>
  <form method="POST">
    <div style="display:flex; flex-direction:column; gap:14px;">
      <div class="form-group">
        <label>Date *</label>
        <input name="pay_date" type="date" required value="{{ today }}">
      </div>
      <div class="form-group">
        <label>Amount (Rs.) *</label>
        <input name="amount" type="number" step="1" required placeholder="150000">
      </div>
      <div class="form-group">
        <label>Method / Bank</label>
        <select name="method">
          <option>Cash</option>
          <option>Meezan Bank</option>
          <option>HBL</option>
          <option>UBL</option>
          <option>Bank Transfer</option>
          <option>Easypaisa</option>
          <option>JazzCash</option>
          <option>Cheque</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <input name="notes" placeholder="e.g. Amount received in Meezan Bank">
      </div>
      <div style="display:flex; gap:12px; margin-top:6px;">
        <button type="submit" class="btn btn-success">Save Payment</button>
        <a href="/customers/{{ customer.id }}" class="btn" style="background:#e2e8f0; color:#444;">Cancel</a>
      </div>
    </div>
  </form>
</div>
{% endblock %}
