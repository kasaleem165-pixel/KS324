<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BHS Internal Audit — Report Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1a3a5c;--navydark:#0f2540;--navylt:#2a5080;--gold:#c9962a;--goldlt:#f0c040;--orange:#d06020;--bluenew:#2070b8;--gbg:#f3f5f8;--gbor:#dde2ea;--gtxt:#6a7888}
html,body{height:100%;font-family:'Inter',sans-serif;font-size:13.5px;color:#1e2d40;background:var(--gbg)}

/* TOOLBAR */
#toolbar{display:flex;align-items:center;gap:8px;background:var(--navydark);padding:8px 16px;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.brand{font-family:'Merriweather',serif;font-size:14px;font-weight:700;color:var(--goldlt);flex:1}
.brand small{color:#aaa;font-size:11px;font-weight:400;margin-left:8px}
.tbtn{padding:6px 14px;border:none;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600;font-family:'Inter',sans-serif}
.tbtn.g{background:var(--gold);color:#111}.tbtn.g:hover{background:var(--goldlt)}
.tbtn.s{background:rgba(255,255,255,.13);color:#fff;border:1px solid rgba(255,255,255,.25)}.tbtn.s:hover{background:rgba(255,255,255,.22)}
.tbtn.r{background:#b03020;color:#fff}.tbtn.r:hover{background:#d04030}

/* LAYOUT */
#main{display:flex;height:calc(100vh - 44px);overflow:hidden}
#LP{width:36%;min-width:300px;max-width:440px;background:#fff;border-right:2px solid var(--gbor);overflow-y:auto;display:flex;flex-direction:column}
#RP{flex:1;overflow-y:auto;background:var(--gbg);padding:20px}

/* LEFT PANEL */
.sec{border-bottom:1px solid var(--gbor);padding:12px 14px}
.sh{font-size:10.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:5px}
.sh::before{content:'';width:3px;height:12px;background:var(--gold);border-radius:2px;display:block}
.fr{margin-bottom:8px}
.fr label{display:block;font-size:11px;font-weight:600;color:var(--gtxt);margin-bottom:3px}
.fr input,.fr select,.fr textarea{width:100%;border:1px solid var(--gbor);border-radius:4px;padding:6px 9px;font-family:'Inter',sans-serif;font-size:12.5px;color:#1e2d40;background:#fff;outline:none}
.fr input:focus,.fr select:focus,.fr textarea:focus{border-color:var(--navylt);box-shadow:0 0 0 3px rgba(42,80,128,.09)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.crow{display:flex;gap:5px}
.crow select{flex:1}
.gbtn{width:28px;flex-shrink:0;border:1px solid var(--gbor);background:#f5f7fa;border-radius:4px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;padding:0}
.gbtn:hover{background:#e4e8f0}

/* RESULTS */
#rcount{font-size:11px;color:var(--gtxt);margin-left:auto}
.selbtns{display:flex;gap:10px;margin-bottom:8px}
.selbtns button{font-size:11px;background:none;border:none;color:var(--navylt);cursor:pointer;text-decoration:underline;padding:0}
.ri{padding:8px 10px;border:1px solid var(--gbor);border-radius:5px;margin-bottom:5px;cursor:pointer;background:#fff;transition:.12s}
.ri:hover{border-color:var(--navylt);background:#f0f5fb}
.ri.on{border-color:var(--navy);background:#eaf0f8}
.ritop{display:flex;gap:7px;align-items:flex-start}
.ricb{margin-top:2px;flex-shrink:0;accent-color:var(--navy);cursor:pointer;width:14px;height:14px}
.rimeta{flex:1}
.ritl{font-size:12.5px;font-weight:600;color:#1e2d40;line-height:1.3}
.risub{font-size:11px;color:var(--gtxt);margin-top:2px}
.rscore{width:100%;height:3px;background:#e0e7ef;border-radius:2px;margin-top:4px}
.rscorebar{height:100%;background:var(--navylt);border-radius:2px}
.badge{display:inline-block;padding:1px 6px;border-radius:10px;font-size:10px;font-weight:700;margin-left:3px}
.badge.repeated{background:#fff0e6;color:#b04800;border:1px solid #f0b080}
.badge.new{background:#e6f0ff;color:#1050a0;border:1px solid #90b8e8}
mark{background:#fff3a0;border-radius:2px;padding:0 1px}
.axrow{display:flex;align-items:center;gap:6px;margin-top:6px;padding-top:6px;border-top:1px dashed #dde}
.axrow label{font-size:11px;font-weight:600;color:var(--gtxt);white-space:nowrap}
.axrow input{flex:1;border:1px solid var(--gbor);border-radius:3px;padding:3px 7px;font-size:12px;outline:none}
#nores{display:none;text-align:center;padding:16px;color:var(--gtxt);font-size:12px}

/* CUSTOM OBS */
#ctgl{width:100%;text-align:left;background:none;border:none;color:var(--navy);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;padding:0}
#cfrm{margin-top:10px;display:none}
#cfrm textarea{min-height:54px;resize:vertical}
#caddbt{width:100%;margin-top:7px;padding:8px;background:#2a6040;color:#fff;border:none;border-radius:4px;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;cursor:pointer}
#genbtn{width:calc(100% - 28px);margin:12px 14px;padding:11px;background:var(--gold);color:#111;border:none;border-radius:6px;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(201,150,42,.3)}
#genbtn:hover{background:var(--goldlt)}

/* REPORT */
#rp{background:#fff;border-radius:6px;box-shadow:0 2px 8px rgba(26,58,92,.1);min-height:300px;padding:30px 34px}
#rpempty{text-align:center;padding:50px 20px;color:var(--gtxt)}
#rpempty .ik{font-size:44px;opacity:.35;margin-bottom:10px}
.rhdr{text-align:center;border-bottom:3px solid var(--navy);padding-bottom:16px;margin-bottom:20px}
.rlogo{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:6px}
.rhdr h1{font-family:'Merriweather',serif;font-size:23px;font-weight:700;color:var(--navy)}
.rhdr h2{font-family:'Merriweather',serif;font-size:14px;font-weight:400;color:var(--navylt);margin-top:4px}
.rmeta{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin-top:13px;text-align:left;font-size:12px}
.rmeta strong{color:var(--navy);display:inline-block;min-width:96px}
.misbox{background:#f0f5fb;border:1px solid #c8d8ec;border-radius:5px;padding:12px 14px;margin-bottom:18px}
.misbox h3{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--navy);margin-bottom:7px}
.misg{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:11.5px;color:#2a4060}
.misg strong{color:var(--navy)}
.catg{margin-bottom:24px}
.cattl{font-family:'Merriweather',serif;font-size:12px;font-weight:700;color:var(--navy);background:#edf2f8;border-left:4px solid var(--navy);padding:7px 12px;margin-bottom:10px;border-radius:0 4px 4px 0;text-transform:uppercase;letter-spacing:.4px}
.oc{border:1px solid var(--gbor);border-left-width:4px;border-radius:5px;margin-bottom:12px;overflow:hidden}
.oc.repeated{border-left-color:var(--orange)}.oc.new{border-left-color:var(--bluenew)}
.och{display:flex;align-items:center;padding:8px 12px;background:#fafbfc;border-bottom:1px solid var(--gbor);gap:7px}
.onum{font-size:11px;font-weight:700;color:var(--gtxt);white-space:nowrap}
.otl{flex:1;font-size:13px;font-weight:700;color:#1e2d40}
.odl{background:none;border:none;cursor:pointer;color:#c03020;font-size:14px;padding:2px 4px;border-radius:3px}
.odl:hover{background:#fde8e8}
.ocb{padding:11px 13px}
.osl{font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--navy);margin-bottom:3px}
.ost{font-size:12.5px;line-height:1.6;color:#2a3a50;margin-bottom:9px}
.oresp{width:100%;border:1px dashed #b0c0d8;border-radius:4px;padding:6px 9px;font-family:'Inter',sans-serif;font-size:12.5px;color:#2a3a50;background:#fafcff;resize:vertical;min-height:46px;outline:none}
.oax{display:flex;align-items:center;gap:7px;margin:8px 0;padding:7px 0;border-top:1px solid #eee;font-size:12px}
.oax strong{font-size:10px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.5px}

/* MODAL */
#movl{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:center;justify-content:center}
#movl.show{display:flex}
.mbox{background:#fff;border-radius:8px;width:460px;max-width:95vw;max-height:84vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.28)}
.mhdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--navy);border-radius:8px 8px 0 0}
.mhdr h3{color:#fff;font-size:14px;font-weight:700}
.mcls{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;line-height:1;padding:0 3px}
.mbdy{flex:1;overflow-y:auto;padding:14px 16px}
.mft{padding:10px 16px;border-top:1px solid var(--gbor);display:flex;justify-content:flex-end}
.mit{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid #f0f3f6}
.mit:last-child{border-bottom:none}
.mitlb{flex:1;font-size:13px;color:#1e2d40}
.mitinp{flex:1;border:1px solid var(--navylt);border-radius:3px;padding:4px 7px;font-family:'Inter',sans-serif;font-size:13px;outline:none;display:none}
.mib{border:1px solid var(--gbor);border-radius:3px;padding:2px 8px;font-size:11px;cursor:pointer;background:#f8f9fb;font-family:'Inter',sans-serif}
.mib.e{color:var(--navy)}.mib.e:hover{background:#e8edf5}
.mib.d{color:#b03020}.mib.d:hover{background:#fde8e8}
.madd{display:flex;gap:6px;margin-top:11px;padding-top:11px;border-top:1px solid var(--gbor)}
.madd input{flex:1;border:1px solid var(--gbor);border-radius:4px;padding:6px 9px;font-family:'Inter',sans-serif;font-size:13px;outline:none}
.madd input:focus{border-color:var(--navylt)}
.mabtn{padding:6px 14px;background:var(--navy);color:#fff;border:none;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.mabtn:hover{background:var(--navylt)}
.cdinp{width:64px!important;flex:none!important}

/* TOAST */
#toast{position:fixed;bottom:20px;right:20px;background:#1a2a3a;color:#fff;padding:9px 15px;border-radius:5px;font-size:13px;font-weight:500;opacity:0;transform:translateY(8px);transition:.3s;z-index:999;pointer-events:none}
#toast.show{opacity:1;transform:translateY(0)}

@media print{
  #toolbar,#LP,#movl,#toast{display:none!important}
  #main{display:block;height:auto}
  #RP{padding:0;background:#fff}
  #rp{box-shadow:none;padding:0}
  .oc{break-inside:avoid;page-break-inside:avoid}
  .oresp{border:none!important;background:transparent}
}
</style>
</head>

<script type="application/json" id="audit-data">
{"campuses":{"LMA11_FCC_Gulberg_Lahore":{"name":"LMA 11-FCC Gulberg, Lahore","audit_type":"Routine Audit Visit + Follow-up","audit_period":"1 Jan 2020 to 03 Feb 2025","visit_dates":"03 Feb 2025 to 21 Feb 2025","previous_report":"26 March 2020","framework":"COSO Internal Control – Integrated Framework","region":"Lahore"},"Clifton_Campus_Karachi":{"name":"Clifton Campus, Karachi","audit_type":"Routine Audit Visit","audit_period":"10 Nov 2020 to 3 Jul 2025","visit_dates":"3 Jul 2025 to 17 Jul 2025","previous_report":"18 Mar 2021","framework":"COSO Internal Control – Integrated Framework","region":"Karachi"},"Garden_Town_Lahore":{"name":"Garden Town Campus, Lahore","audit_type":"Routine Audit Visit","audit_period":"24 Aug 2021 to 22 Sep 2025","visit_dates":"22 Sep 2025 to 17 Oct 2025","previous_report":"Not specified","framework":"COSO Internal Control – Integrated Framework","region":"Lahore"}},"observations":[{"id":"OBS-001","title":"Expenditure Exceeded the Budgeted Amount","category":"Branch Imprest, Payments & Accounts","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore","Clifton_Campus_Karachi","Garden_Town_Lahore"],"keywords":["budget","overspending","variance","imprest","expenditure","budget overrun"],"observation":"Review of system-generated Budget Variance Sheets showed that significant overspending was made under various expense heads. Overspending was observed across multiple years under heads including Office Staff Salaries, Building Repair & Maintenance, Livery Expenses, Direct Cost – AC Repair, and Educational Visits.","recommendation":"As per policy: 'Budget variance shall be monitored for judicious use of funds allocated under all Heads of Expenses. System generated budget variance sheet be consulted to monitor variance of expense against budget allocation and discrepancy, if any, rectified.' 'Branch Purchase Committee and certain analytical reports in the Module e.g. Imprest Budget Variance Statement shall provide support to BH in this regard.' 'Monitoring of Opex (Imprest) variances of Branches shall be conducted at RO Finance on monthly basis.'","audit_view":"Branch management should review budget variances on a monthly basis and obtain prior approval for any anticipated overspending. RO Finance should strengthen monitoring controls.","typical_response":"Noted for future compliance."},{"id":"OBS-002","title":"Budget for Student Expenditure Remained Unutilized","category":"Branch Imprest, Payments & Accounts","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore","Clifton_Campus_Karachi","Garden_Town_Lahore"],"keywords":["student expenditure","unutilized","savings","budget","student expense"],"observation":"As per Company policy, savings under the category of student expenses should be avoided. During review of Budget Variance Sheets, it was observed that budget for student expenditure remained un-utilized in certain heads across multiple financial years.","recommendation":"As per policy: 'There should be no saving of funds under the category of student expenses.' Branch management should plan student activities and expenditures proactively to ensure budgeted funds are utilized for student welfare.","audit_view":"Branch should plan extracurricular activities, educational visits, and student welfare programs to utilize the allocated budget for student benefit.","typical_response":"Noted for future compliance."},{"id":"OBS-003","title":"Accounting Procedure not Followed / Bank Payment Vouchers","category":"Branch Imprest, Payments & Accounts","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore"],"keywords":["BPV","bank payment voucher","accounting","voucher","JV","journal voucher","cheque"],"observation":"Cheques were prepared and issued without printing bank payment vouchers. Vouchers were printed after making the transaction. In certain instances, JVs and BRs were also printed with delay. Additionally, bank payments were found booked through Journal Vouchers instead of Bank Payment Vouchers.","recommendation":"As per policy: 'All bank payments shall be made after obtaining approval from the Branch Head on Bank Payment Vouchers.' 'BA is responsible for recording all receipts, payments and relevant entries in the module on daily basis after obtaining approval from the BH.' Bank payments should be booked through Bank Payment Vouchers only.","audit_view":"Proper sequencing of voucher preparation and payment is essential for maintaining audit trail. All transactions must be recorded in real-time.","typical_response":"Noted for future compliance."},{"id":"OBS-004","title":"Purchase Committee not Properly Functioning","category":"Branch Imprest, Payments & Accounts","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore","Garden_Town_Lahore"],"keywords":["purchase committee","PC","BPC","procurement","committee","RFQ","CSQ"],"observation":"The Purchase Committee members were not actively participating in PC-related activities. Bills exceeding PKR 5,000 were not being verified by Purchase Committee members. Members were not reviewing RFQ/CSQ documents or providing guidance on vendor management.","recommendation":"As per policy, general functions of PCs include: advise for sourcing strategy; provide guidance for vendor management; review and advise whether proposed procurement actions are in accordance with the Manual; review that equal opportunity is provided to every genuine competitor; review and evaluate RFQ, CSQ and related documents submitted; review negotiated price, terms & conditions.","audit_view":"Active participation of Purchase Committee is critical for ensuring transparency and compliance in procurement. BH should ensure all PC members are briefed on their roles and responsibilities.","typical_response":"Noted. PMC members are strictly guided to follow the procedure."},{"id":"OBS-005","title":"Withholding Tax Deposited with Delay","category":"Branch Imprest, Payments & Accounts","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore","Garden_Town_Lahore"],"keywords":["withholding tax","WHT","tax deposit","delay","suppliers","vendors","FBR"],"observation":"Tax withheld from suppliers/vendors was not deposited within seven days from the date of payment as required. Delays were observed in the ledger for Withholding Tax U/s 50(4). This creates a risk of exposure to penalties and interest charges by tax authorities.","recommendation":"As per SMFO-HO letter dated 04 Jul 2014: 'Please follow the instructions at your end and also instruct the schools and other concerned staff to deduct the tax accordingly and deposit the same into Government Treasury within seven days from the deduction and payment.' Branch Accountant must monitor tax deposit deadlines strictly.","audit_view":"Delayed deposit of withholding tax exposes the organization to statutory penalties. A compliance calendar should be maintained by the Branch Accountant.","typical_response":"Mentioned details belong to previous years. Currently we are strictly following the instructions and procedures."},{"id":"OBS-006","title":"Reimbursements not Timely Processed by RO","category":"Branch Imprest, Payments & Accounts","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore","Clifton_Campus_Karachi","Garden_Town_Lahore"],"keywords":["reimbursement","RO","delay","claims","regional office","20 days"],"observation":"Delays were observed in the processing of reimbursement claims by Regional Office. Several claims were not processed within the stipulated 20-day timeframe. This results in cash flow pressure on branches that have to incur expenses from limited imprest funds.","recommendation":"As per policy: 'All reimbursement claims received shall be checked by respective Accounts department within 20 days of their receipt. SMF-RO and Manager Accounts at HO shall ensure reconciliation of inter office reimbursements balances on monthly basis.'","audit_view":"RO Finance should prioritize timely processing of branch reimbursement claims. If the 20-day timeline is not practicable, it should be formally revised through the proper policy amendment procedure.","typical_response":"Some bills are based on purchase orders (POs) forwarded to relevant departments for PO generation, which can take time. In practical scenario 20 days' time is insufficient."},{"id":"OBS-007","title":"Splitting of Transactions to Bypass Company Policies","category":"Branch Imprest, Payments & Accounts","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore","Clifton_Campus_Karachi"],"keywords":["splitting","transaction split","quotations","bypass","policy violation","procurement","competitive bidding"],"observation":"Transactions were apparently split to avoid obtaining competitive quotations, preparing a comparative statement, and issuing a Purchase Order (PO). Examples: Soft Boards procured as two separate transactions on the same day; Conservance items purchased from same vendor in multiple transactions on same/consecutive days totaling Rs. 632,125; Tea items purchased from same vendor on consecutive days. Similar instances were noted where the requirement of obtaining multiple quotations (for tasks exceeding PKR 25,000) was circumvented by splitting the activity.","recommendation":"As per policy: 'Breaking or splitting a transaction into smaller values to avoid approval from concerned authorities will be considered a violation of this policy.' 'Procurement of Opex items having value PKR 25,000 or above requires competitive bidding.' Branch management must ensure all procurement is conducted in a transparent and consolidated manner.","audit_view":"Transaction splitting is a serious control violation that undermines procurement transparency. Branch Head must ensure all purchases are planned in advance and consolidated to avoid policy circumvention. Repeated instances may warrant disciplinary action.","typical_response":"Noted. We will be more careful and vigilant in future."},{"id":"OBS-008","title":"Procurement at Higher Rates than Market Rates","category":"Branch Imprest, Payments & Accounts","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore"],"keywords":["higher rates","market rates","procurement","overpriced","comparison","vendor"],"observation":"Staff of branch had made purchases at higher rates as compared to the market. Physical verification and market comparison confirmed overcharging by vendors for certain items including Track Lights and hardware items.","recommendation":"Procurement processes should be strengthened to ensure purchases are made at competitive market rates. Mandatory market comparison should be conducted before finalizing any purchase. Purchase Committee should actively review rates.","audit_view":"Overpayment to vendors results in financial loss to the organization. A robust price benchmarking mechanism and active Purchase Committee oversight can prevent such occurrences.","typical_response":"Noted for future compliance. Guidance to the concerned OFA will be provided."},{"id":"OBS-009","title":"Vendors Registration not Properly Performed","category":"Branch Imprest, Payments & Accounts","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore","Garden_Town_Lahore"],"keywords":["vendor registration","VRF","VRA","registered vendor","vendor register","unregistered vendor"],"observation":"Procurement was being made from unregistered vendors. VRA (Vendor Registration Application) Forms and supporting documents were not available for many vendors. In one campus, no vendor registration had been conducted since the accountant's joining in September 2023.","recommendation":"As per policy: 'The procurement shall be made from registered vendors. The registered vendor is a vendor for which Vendor Master Data is created in Vendor Register for Branches based on approved VRF. BH shall review the documents submitted and provide approval on VRF for inclusion in Vendor Register, upon satisfaction.' Branch Head must review the vendor register at least once annually.","audit_view":"Procuring from unregistered vendors exposes the organization to financial and reputational risk. An immediate vendor registration drive should be conducted and future procurements restricted to registered vendors only.","typical_response":"Will complete the remaining regular vendor registration before follow-up visit."},{"id":"OBS-010","title":"Periodic Evaluation of Registered Vendors not Performed","category":"Branch Imprest, Payments & Accounts","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore"],"keywords":["vendor evaluation","periodic evaluation","vendor performance","BPC","supplier review"],"observation":"The practice of periodic evaluation of registered vendors was not being followed. Vendor Performance Evaluation Forms had not been completed by BPC members within the required two-year cycle.","recommendation":"As per policy: 'BH shall be responsible for the timely evaluation of vendors. Designated Official(s) of BPC shall perform the periodic evaluation of registered vendors, at least once in two years, by completing Vendor Performance Evaluation Form.'","audit_view":"Regular vendor evaluation ensures service quality and competitive pricing. BH must schedule and conduct vendor evaluations as per the prescribed timeline.","typical_response":"Noted for future compliance."},{"id":"OBS-011","title":"Incongruities in Preparation & Filing of Purchase Orders","category":"Branch Imprest, Payments & Accounts","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore"],"keywords":["purchase order","PO","work order","WO","pre-numbered","vendor acceptance","sequential"],"observation":"POs/WOs were not pre-numbered and copies were not filed in sequential order. Vendor acceptance was not being properly obtained on Purchase Orders.","recommendation":"Purchase orders/work orders should be pre-numbered and sequentially filed once acknowledged by vendors. 'PO shall be handed over/forwarded to vendor, by the designated Official of SC/BA for vendor's acceptance.' Acknowledgement from vendor must be obtained and filed.","audit_view":"Proper PO management with sequential numbering and vendor acknowledgement is essential for contractual control and audit trail purposes.","typical_response":"Noted for future compliance."},{"id":"OBS-012","title":"Copy of Cheques not Properly Attached with Voucher","category":"Branch Imprest, Payments & Accounts","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore"],"keywords":["cheque copy","voucher","BPV","photocopy","cheque number","bank payment"],"observation":"Photocopy of cheques were not being attached with Bank Payment Vouchers. Additionally, cheque numbers of certain transactions were not recorded in Bank Payment Vouchers, creating difficulties in bank reconciliation.","recommendation":"As per policy: 'Photocopy of the cheque shall also be attached with the voucher.' Cheque number for each transaction should be recorded to facilitate bank reconciliation.","audit_view":"Maintaining complete documentation including cheque copies ensures a proper audit trail and facilitates reconciliation.","typical_response":"Noted. Now we are strictly following the instructions and procedures."},{"id":"OBS-013","title":"Transactions not Routed Through Vendor Ledger","category":"Branch Imprest, Payments & Accounts","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore"],"keywords":["vendor ledger","regular vendor","ledger","accounting","major vendor"],"observation":"Payments to regular/major vendors were made without routing them through their respective vendor ledgers. This results in incomplete vendor-wise transaction history.","recommendation":"Branch should ensure that related transactions are properly routed through vendor ledgers. As per policy: 'In case of major/regular vendors, the entries shall be recorded in accordance with the prescribed procedure.'","audit_view":"Routing transactions through vendor ledgers enables proper balance confirmation, facilitates reconciliation, and strengthens internal controls.","typical_response":"Noted for future compliance."},{"id":"OBS-014","title":"Excess Amount Charged by Paint Contractor","category":"Branch Imprest, Payments & Accounts","type":"New","campuses":["Garden_Town_Lahore"],"keywords":["paint contractor","overcharging","excess billing","measurement","paint work","recovery"],"observation":"Paint-work contractor claimed excessive measurements in bills. Physical measurement performed by S&A Team in presence of Branch OFA and Branch Assistant Accountant confirmed overcharging. The contractor overcharged Rs. 41,882 for paint-work executed in year 2024. Both Branch OFA and Branch Assistant Accountant acknowledged the discrepancy.","recommendation":"Excess amount of Rs. 41,882 charged by the Vendor should be recovered or adjusted from other bills of the vendor. Validated paint area measurements endorsed by RO Works Department should be maintained to prevent future overcharging.","audit_view":"The recovery/deduction of Rs. 41,882 needs to be made at the earliest from the vendor, with intimation to relevant personnel of Systems & Audit department. A joint measurement exercise with Works Department should be conducted and maintained on record.","typical_response":"Vendor contacted and he agreed to deduct the difference from his payment."},{"id":"OBS-015","title":"Validated Paint Area Measurement not Available","category":"Branch Imprest, Payments & Accounts","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore","Clifton_Campus_Karachi"],"keywords":["paint area","measurement","RO endorsement","works department","paint contractor"],"observation":"Total paintable area of the premises was prepared by Branch Management but had not been endorsed/verified by RO Works Department. Without validated measurements, there is no independent basis to verify contractor bills.","recommendation":"Branch should maintain an updated record of paint area measurement duly endorsed by relevant personnel at RO Works Department. This should be used as the basis for verifying all paint contractor bills.","audit_view":"Without independently verified paint area measurements, branches are vulnerable to overcharging by contractors. A joint verification with Works Department is strongly recommended.","typical_response":"Will prepare the detail and get it verified from ROC."},{"id":"OBS-016","title":"Cash in Hand Exceeded the Prescribed Limit","category":"Cash and Bank","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore","Clifton_Campus_Karachi"],"keywords":["cash","petty cash","cash limit","25000","closing balance","cash in hand"],"observation":"Closing balance of cash in hand had exceeded the prescribed limit of Rs. 25,000 on various occasions throughout the audit period. This creates risk of misappropriation and theft.","recommendation":"As per policy: 'The maximum limit of closing balance of cash in hand is PKR 25,000.' Excess cash should be deposited in the bank account immediately. Branch Accountant should monitor daily cash balance.","audit_view":"Maintaining cash balances above prescribed limits increases the risk of misappropriation. Excess cash must be deposited promptly.","typical_response":"Noted for future compliance."},{"id":"OBS-017","title":"Negative Balance of Bank Ledger","category":"Cash and Bank","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore","Clifton_Campus_Karachi","Garden_Town_Lahore"],"keywords":["negative balance","bank ledger","credit balance","bank account","principal bank","overdraft"],"observation":"In certain instances, the balance of the bank ledger was negative (credit) at end of business day. This indicates either timing differences in recording, or issuance of cheques without availability of sufficient funds.","recommendation":"BA should ensure that all transactions are recorded in real-time and reconciled promptly to prevent discrepancies. 'BA is responsible for recording all receipts, payments and relevant entries in the module on daily basis.' Cheques should only be issued after confirming availability of funds.","audit_view":"Negative bank ledger balance is a serious accounting deficiency. Real-time recording and daily reconciliation are essential to maintain accurate financial records.","typical_response":"Noted for future compliance. Strict monitoring will be maintained."},{"id":"OBS-018","title":"Discrepancies in Cash Collection Activities","category":"Cash and Bank","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore"],"keywords":["cash collection","activity","co-curricular","class list","record","quotations","circular"],"observation":"Record for cash collection activities was not properly maintained: No record before March 2023; company policies for obtaining quotations and preparing CSQ were not complied with; Class Lists from system and summary of cash collection were not attached; certain activities were open and details not properly appearing.","recommendation":"Class Teacher shall obtain a Class List from the system and record the amount received against each student name. CT shall submit amount collected along with CL to Coordinator within two days from last date in Circular. The Branch Accountant should submit the activity account at closure of the activity to the School Head for approval.","audit_view":"Proper record-keeping for cash collection activities is essential to ensure all collected amounts are accounted for and deposited correctly.","typical_response":"Mentioned details belong to previous years. Currently we are strictly following the instructions and procedures."},{"id":"OBS-019","title":"Missing Approval for Blood Relatives in Same Branch","category":"Recruitment, Payroll & Employee Record","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore","Garden_Town_Lahore"],"keywords":["blood relatives","family members","HHR approval","conflict of interest","nepotism","relatives"],"observation":"Some blood relatives/related family members were working in the same branch for which approval from Head of HR (HHR) was not available. Conflict of Interest Disclosure Forms were also not properly filed.","recommendation":"As per policy: 'No blood relations and related family members shall be hired in the same Office/Branch; any exception shall be provided by the HHR.' Conflict of Interest Disclosure Forms must be obtained and filed for all such cases.","audit_view":"Working of family members in the same branch without HHR approval violates HR policy and creates conflict of interest. All existing cases must be regularized immediately through proper approval channels.","typical_response":"Employees' conflict of interest disclosure forms have been made and sent to HR-ROC for approval."},{"id":"OBS-020","title":"Delay in Employee Confirmations","category":"Recruitment, Payroll & Employee Record","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore","Clifton_Campus_Karachi","Garden_Town_Lahore"],"keywords":["confirmation","probation","delay","employee","probationary period","extension"],"observation":"Confirmation of certain employees was not made within the required timeframe after completion of the six-month probationary period. No intimation of extension of probation was provided to employees in several cases. Copy of extension letters were also not provided.","recommendation":"As per policy: 'All regular employees are required to complete an initial probationary period of six working months extendable for a period of three working months on grounds of performance issues supported by documented reasons.' BEAMS generates a system intimation email to line manager one month before end of probation. Confirmation orders must be issued timely.","audit_view":"Delayed confirmation of employees creates ambiguity regarding employee status and may lead to HR disputes. Timely issuance of confirmation/extension orders with proper communication is essential.","typical_response":"Noted for future compliance."},{"id":"OBS-021","title":"Outgoing/Departure Attendance not Marked by Staff","category":"Recruitment, Payroll & Employee Record","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore","Clifton_Campus_Karachi","Garden_Town_Lahore"],"keywords":["attendance","biometric","outgoing","departure","marking","BEAMS"],"observation":"Outgoing/departure attendance was not marked by various staff members in multiple instances. This results in incomplete attendance records and makes it difficult to monitor actual working hours.","recommendation":"Branch Head should monitor attendance record. Staff should raise application for attendance not marked or early leaving. As per policy: 'Employees shall mark their attendance on biometric devices (online attendance) installed in offices.'","audit_view":"In cases of 'Employee Out' not marked, application for 'Attendance not Marked' should be raised. In cases of deliberate and habitual non-compliance, appropriate disciplinary action should be taken by HR.","typical_response":"We have strictly instructed all staff to follow the guidelines."},{"id":"OBS-022","title":"Short Office Hours","category":"Recruitment, Payroll & Employee Record","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore","Clifton_Campus_Karachi","Garden_Town_Lahore"],"keywords":["short hours","early leaving","office timings","attendance","early departure","timings"],"observation":"Instances were observed in which employees had not complied with the prescribed timings and left early without submitting required applications. This was observed across teaching and non-teaching staff.","recommendation":"Employees should follow office hours as mentioned in BEAMS. Branch Head should actively monitor attendance records. In case of early departure, a Short Leave application must be submitted. In cases of deliberate and habitual non-compliance, appropriate action should be taken by the HR department.","audit_view":"Habitual early leaving without application constitutes a disciplinary matter. Branch Head should take corrective action and where necessary escalate to HR.","typical_response":"Noted."},{"id":"OBS-023","title":"Delay in Final Settlement of Employees","category":"Recruitment, Payroll & Employee Record","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore","Clifton_Campus_Karachi","Garden_Town_Lahore"],"keywords":["final settlement","FS","delay","clearance","left employee","severance"],"observation":"Final settlement claims of left employees were finalized with significant delays beyond the stipulated three-week timeframe. Certain employee records were also found missing in settlement files.","recommendation":"As per policy: 'Keeping in view all the requirements, the clearance and final settlement process must not take more than three working weeks barring exceptions.' 'Final settlement of employees shall be paid within 45 days of their last working days.' Missing records must be traced and attached.","audit_view":"RO office should expedite the final settlement process. Delays particularly during July–October are noted due to profit calculations and online cheque issuance timelines. If prescribed timelines are not practicable, they should be formally revised.","typical_response":"Delays persist during July to October due to profit calculations at Corporate Finance and online cheque issuance process."},{"id":"OBS-024","title":"Incomplete Employee Files","category":"Recruitment, Payroll & Employee Record","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore","Clifton_Campus_Karachi","Garden_Town_Lahore"],"keywords":["employee file","personal file","missing documents","CNIC","photographs","nomination form","incomplete"],"observation":"Documents were missing in employee files including: Detailed CV, photographs, attested CNIC copy, nomination forms, health insurance forms, emergency contact information, signed undertakings, security clearance forms, and confirmation letters.","recommendation":"As per policy: 'Files of all School employees shall be maintained and updated properly.' 'Branch Head shall ensure that all the required documents are filed in personal files of employees as per the checklist pasted in the file.'","audit_view":"Branch should ensure completeness of all employee files. Since audit was performed on sample basis, branch management should review all employee files comprehensively.","typical_response":"Noted for future compliance. Completing mentioned documentation."},{"id":"OBS-025","title":"Reference Check / Security Reference Check not in Practice","category":"Recruitment, Payroll & Employee Record","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore"],"keywords":["reference check","security check","HRM-008","HRM-012","background check","hiring"],"observation":"The Reference Check Form (HRM-008) and Security Reference Check Form (HRM-012) were not attached in any employee files selected for audit. These forms are prescribed in HR policy for all new hires.","recommendation":"As per policy: 'The concerned HR Department shall check the employment history and references of the final candidate(s) under consideration through a formal Employee Reference Check Form (HRM-008).' 'Concerned HR staff shall attach Security Reference Check Form (HRM-012) in the personnel file of a new employee.'","audit_view":"Compliance with employee reference and security check procedures is essential, especially given the nature of work involving children. If forms need to be updated, the change should be referred to concerned authorities.","typical_response":"The form is not currently implemented in schools. Discussions are underway."},{"id":"OBS-026","title":"EOBI Numbers not Updated in BEAMS","category":"Recruitment, Payroll & Employee Record","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore","Garden_Town_Lahore"],"keywords":["EOBI","BEAMS","registration","social security","employee benefit","PESSI","SESSI"],"observation":"EOBI numbers of some employees were not updated in BEAMS Basic Info Report. Additionally, certain employees were not registered with EOBI at all. PESSI/SESSI records including copy of data forms/cards of relevant staff were also not available in branch.","recommendation":"As per policy: 'BA shall make necessary arrangement for registration of employees who are not registered with EOBI.' EOBI registration should be made immediately upon joining of employee and updated in module. Proper procedure should be devised for PESSI/SESSI registration, record-keeping, and monthly payments.","audit_view":"EOBI and social security compliance is a statutory requirement. Non-compliance may expose the organization to legal liability. A comprehensive review of all employee registrations is recommended.","typical_response":"All employees are registered in EOBI; only EOBI numbers are not updated on BEAMS — will be updated soon."},{"id":"OBS-027","title":"Social Security Cards not Filed / Numbers not Updated","category":"Recruitment, Payroll & Employee Record","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore"],"keywords":["social security","SESSI","PESSI","card","BEAMS","update"],"observation":"Copy of Social Security Cards were not filed in respective personal files. Social Security Card Numbers had not been updated in BEAMS by the Branch Accountant.","recommendation":"As per policy: 'BA shall obtain copy of Social Security Cards from employees and file these in respective personal files.' 'The BA shall obtain the Social Security Number from employees and update the same in BEAMS.'","audit_view":"Complete social security record is essential for regulatory compliance and employee benefit management.","typical_response":"Noted for future compliance."},{"id":"OBS-028","title":"Reports in BEAMS not Matched","category":"Recruitment, Payroll & Employee Record","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore"],"keywords":["BEAMS","report mismatch","employee count","discrepancy","HR","roster"],"observation":"Discrepancy was observed between employee count in different BEAMS reports. The number of employees in the branch listing did not match the Basic Info Report, with a difference of 7 employees. Left employees were still appearing in system due to incomplete data entry.","recommendation":"Branch management should review reports and coordinate with HR Department for earliest resolution. Left employees' data must be updated in BEAMS with correct leaving dates.","audit_view":"Data integrity in BEAMS is critical for payroll accuracy and HR compliance. Regular reconciliation of BEAMS reports should be conducted.","typical_response":"Some left employees are still showing due to leave date not entered by HR-ROC. Email sent to HR-ROC."},{"id":"OBS-029","title":"Handing/Taking Over Procedure not Followed","category":"Recruitment, Payroll & Employee Record","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore","Clifton_Campus_Karachi"],"keywords":["HOTO","handing over","taking over","branch head","PRO","transfer","handover"],"observation":"Formal HOTO (Handing Over/Taking Over) procedure was not followed in multiple cases for Branch Heads and PROs. Approved copy of HOTO documents were not available in branches. Audit observations HOTO (HRM-031) was also not obtained.","recommendation":"As per policy: 'The overall responsibility of smooth and effective HOTO task rests with the BH/FI/HOD of the departing employee.' 'S&A Official(s) shall discuss unresolved points of Audit Report(s) with departing BH/BA and obtain HOTO of Audit Observations (HRM-031) from joining employee for their resolution.'","audit_view":"Proper HOTO ensures continuity of operations and accountability for outstanding items. RO should enforce HOTO compliance and forward approved copies to branches.","typical_response":"Referred to Regional Office."},{"id":"OBS-030","title":"Employee Registration on Biometric Device with Delay","category":"Recruitment, Payroll & Employee Record","type":"New","campuses":["Clifton_Campus_Karachi"],"keywords":["biometric","attendance device","registration","new employee","joining"],"observation":"Employees hired were registered with delay on Biometric Device beyond the prescribed two-day timeframe after joining.","recommendation":"As per policy: 'Employees must get themselves registered on one or more biometric devices within two days of their joining.' Registration on biometric devices and updating of timing schedule shall be performed as per the responsibilities matrix.","audit_view":"Delayed biometric registration results in incomplete attendance records for new employees. This should be treated as a priority task on the employee's first day.","typical_response":"Due to late submission of documents the employee was registered late."},{"id":"OBS-031","title":"Leave Applications not Raised on BEAMS","category":"Recruitment, Payroll & Employee Record","type":"New","campuses":["Clifton_Campus_Karachi"],"keywords":["leave application","BEAMS","casual leave","medical leave","absent","deduction"],"observation":"Employees did not raise leave applications on BEAMS in multiple cases, resulting in absent deductions from salary instead of proper leave balances being utilized.","recommendation":"As per policy: 'All employees are required to inform their LM/HOD in advance or at the latest within the initial hours of the day in question if they need to take Casual or Medical Leave. Upon resuming duty, employees shall submit their leave application through BEAMS to their approving authority.'","audit_view":"Branch staff should be instructed to raise timely leave applications on BEAMS to ensure accurate leave and payroll records.","typical_response":"Informed to employees and noted for future compliance."},{"id":"OBS-032","title":"Outstation Claimed for Personal Works","category":"Recruitment, Payroll & Employee Record","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore"],"keywords":["outstation","personal work","abuse","claim","official visit","misuse"],"observation":"Some employees had apparently forwarded applications for 'Outstation' against their personal works, and such applications were approved. In one case, no reason was mentioned but the application was approved.","recommendation":"'Outstation' should only be applied for official visits or meetings at a place other than the employee's work premises. Proper reason must be mentioned. As per policy: 'Employees going on an official outstation visit must submit an application at least one day before or within three working days after completion of outstation visit.'","audit_view":"Since these instances were identified on a sample basis, Branch Management should review the complete record and coordinate with HR. Approving authorities must scrutinize outstation applications carefully.","typical_response":"Mentioned details belong to previous years. Currently strictly following instructions."},{"id":"OBS-033","title":"Delay in Providing Livery Items","category":"Recruitment, Payroll & Employee Record","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore","Garden_Town_Lahore"],"keywords":["livery","uniform","junior staff","livery items","summer uniform","winter uniform","delay"],"observation":"Delays in providing livery items to entitled employees were observed. Livery record prior to a certain period was also not available in the branch.","recommendation":"As per policy: 'The activity to procure livery shall be initiated considering provision of summer uniform in April and winter uniform in September.' Livery shall be provided to regular/contractual entitled employees in accordance with their entitlement. Record of livery issued must be maintained.","audit_view":"Timely procurement of livery items requires advance planning. Procurement must be initiated well before the April/September deadlines.","typical_response":"Livery orders were placed on time, but vendor provided them late."},{"id":"OBS-034","title":"Salary Paid Through Branch Bank Account","category":"Recruitment, Payroll & Employee Record","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore"],"keywords":["salary","payroll","branch bank","imprest","payment","salary account"],"observation":"Salary-related transactions were being made from the Branch Bank Account/Imprest instead of through the designated salary payment channel. Salary reimbursements were later claimed from RO.","recommendation":"Salary of all employees should be processed through the designated salary payment procedure adopted by the organization. Direct salary payment from branch bank account is not permitted.","audit_view":"Processing salary from branch imprest creates accounting complications and bypasses payroll controls. Designated salary bank accounts must be used for all salary payments.","typical_response":"We are currently following the policy. Previous practice has been changed."},{"id":"OBS-035","title":"Early Confirmation of Employee without Approval","category":"Recruitment, Payroll & Employee Record","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore"],"keywords":["early confirmation","probation","approval","HHR","re-hire"],"observation":"An employee was confirmed early without completion of probationary period and without approval from Head HR.","recommendation":"As per policy: 'All regular employees are required to complete an initial probationary period of six working months.' 'If a confirmed employee is re-hired, before the completion of six months the appointing authority may employ him/her as a confirmed employee after approval of Head HR.' Relevant approval must be placed in employee file.","audit_view":"Branch management is requested to attach relevant approval in employee file and ensure such early confirmations only occur with requisite HHR approval.","typical_response":"Noted. Mentioned detail belongs to previous years."},{"id":"OBS-036","title":"Sandwich Leaves not Considered","category":"Recruitment, Payroll & Employee Record","type":"New","campuses":["Garden_Town_Lahore"],"keywords":["sandwich leave","leave","holiday","gazetted","off day","BEAMS"],"observation":"As per BSS policies, gazetted/official leaves sandwiched between employees' leaves should be counted as part of leaves. In a few instances, sandwich leaves were not accounted for correctly.","recommendation":"As per policy: 'Off days or gazetted holidays falling in between leave periods (sandwiched) shall be counted as part of that leave.' Leaves not auto-dealt by the system should be reported to RO-HR for manual adjustment.","audit_view":"The leaves which are not auto-dealt by BEAMS should be reported to RO-HR to account for as per policy.","typical_response":"These leaves are auto-adjusted by BEAMS."},{"id":"OBS-037","title":"Registration Fee Deposited with Delay","category":"Student Record","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore","Clifton_Campus_Karachi","Garden_Town_Lahore"],"keywords":["registration fee","deposit","delay","bank","cash","PRO","weekly deposit"],"observation":"There were delays in depositing the registration amount into the bank account beyond the prescribed weekly deadline. In some cases, amounts exceeding Rs. 10,000 were not deposited immediately as required.","recommendation":"As per policy: 'Cash collected as registration fee shall be deposited in the main bank account designated for collection, by close of every working week. However, in cases where the collection exceeds PKR 10,000/- the same must be deposited immediately.' Cash collected on account of student registration shall not be utilized by the Branch under any circumstances.","audit_view":"Delayed deposit of registration fee increases the risk of misappropriation. PRO must hand over collected amounts to accountant on the same day of collection.","typical_response":"Noted for future compliance."},{"id":"OBS-038","title":"Incomplete / Wrong Student Information in BEAMS","category":"Student Record","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore","Clifton_Campus_Karachi"],"keywords":["BEAMS","student data","incomplete","father occupation","mother CNIC","gender","city","contact information"],"observation":"Multiple data discrepancies observed in BEAMS: Father occupation not mentioned; Mother CNIC missing; Mother occupation left blank; City name not mentioned; Wrong gender of student; Missing contact information (phone numbers, addresses).","recommendation":"Concerned personnel should ensure complete and correct information is updated in BEAMS at the time of admission. PRO and BA are jointly responsible for accuracy of student data in the Integrated Student Module (ISM).","audit_view":"Complete and accurate student data is essential for emergency contact purposes and regulatory compliance. Branch should ensure completeness of all student data as audit was performed on sample basis.","typical_response":"Noted for future compliance."},{"id":"OBS-039","title":"Incomplete Student Files","category":"Student Record","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore","Clifton_Campus_Karachi","Garden_Town_Lahore"],"keywords":["student file","birth certificate","CNIC","photograph","checklist","admission form","PRO"],"observation":"Documents such as copy of parent's CNIC, birth certificates, photographs, and registration/admission forms were missing in student files. Checklists were not properly attached and filled. Transfer orders were not properly attached in Transfer-in Student Files.","recommendation":"As per policy: 'It is the responsibility of the PRO to prepare the file for each student upon finalisation of the student admission process.' 'A detailed Student File Check List shall be pasted on the inside of the file cover. The PRO shall ensure that all required documents are filed in personal files of students.'","audit_view":"Branch should ensure completeness of all student files. Since audit was performed on sample basis, a comprehensive review of all student files is recommended.","typical_response":"Noted for future compliance. Will coordinate with parents to update files."},{"id":"OBS-040","title":"Files of Transferred-In Students not Available","category":"Student Record","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore"],"keywords":["transfer","student file","transferred-in","transferor","transferee","PRO","missing file"],"observation":"Files of transferred-in students were not available in the branch. Turnaround time for file dispatch is prescribed as 1 week but was not being complied with.","recommendation":"As per policy: 'PRO of transferor Branch shall ensure the completeness of student file before its dispatch. The PRO of transferee Branch shall also ensure the same.' Turnaround time is 1 week. Contact transferor branch to locate missing files.","audit_view":"Although duplicate files have been prepared, the original missing files should be located and safe custody ensured. It is suggested to contact the transferor branch for file recovery.","typical_response":"Duplicate files have been made."},{"id":"OBS-041","title":"Anomalies in Registration Fee Collection and Deposit","category":"Student Record","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore"],"keywords":["registration fee","short deposit","missing deposit slips","wrong dates","BEAMS","discrepancy","shortage"],"observation":"Multiple anomalies identified: Short deposit of Rs. 8,100 between registration amounts in BEAMS and available deposit slips; missing deposit slips; wrong deposit dates in BEAMS not matching actual bank deposit slips; deposit dates earlier than receipt dates; wrong deposit slip numbers in BEAMS.","recommendation":"Registration fee should be deposited in full and within stipulated time. Correct dates and slip numbers must be recorded in BEAMS. BH must validate bank deposit slips and registration receipts. Parent signatures must be obtained on receipts.","audit_view":"Short deposit and date discrepancies are serious control weaknesses that require immediate investigation. All discrepancies should be reconciled and shortfall recovered.","typical_response":"Noted for future compliance."},{"id":"OBS-042","title":"Registration Fee Collected Without Issuing Receipt","category":"Student Record","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore"],"keywords":["registration receipt","MRR","manual receipt","cash collection","weekend","non-working day"],"observation":"Registration receipts were recorded on Saturday and Sunday (non-working days), indicating registration fee was collected without issuing a receipt to parents. Student registrations were later entered into the system on non-working days. Manual registration receipts were also not provided.","recommendation":"As per policy: 'Registration Fee shall be collected in cash and Registration Fee Acknowledgement Receipt shall be issued to Parents/Students as acknowledgement of cash received.' 'In case of non-availability of BEAMS Process Manager, Registration Fee Acknowledgement Receipt shall be issued as acknowledgement.' 'MRR must be printed, pre-numbered and issued in order.'","audit_view":"Collection of fees without issuance of receipts is a fundamental control weakness. All collections must be immediately receipted to protect both the organization and the parents.","typical_response":"Noted for future compliance."},{"id":"OBS-043","title":"Fee Concession Approvals not Properly Filed","category":"Student Record","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore","Clifton_Campus_Karachi"],"keywords":["fee concession","fee exemption","approval","student file","RO validation","concession form"],"observation":"Approvals of fee concessions being availed by students were not properly attached in student files. Fee Exemption/Concession Forms were not verified by Regional Accountant/Senior Manager Finance-ROS in several cases.","recommendation":"Such approvals should be placed in respective student files. 'Fee exemption/Concession Form shall be submitted to RO for verification. Employee confirmation letter/Child birth certificate issued by NADRA shall be attached as supporting document.' PRO should check all files and attach relevant approvals.","audit_view":"Unauthorized fee concessions represent a financial risk. All concession approvals must be properly documented, verified by RO, and filed in student records.","typical_response":"Noted for future compliance."},{"id":"OBS-044","title":"Unclaimed Student Security","category":"Student Record","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore"],"keywords":["student security","unclaimed","refund","cheque","dispatch","BEAMS"],"observation":"In certain cases, student security was appearing as 'Unclaimed Security' in BEAMS. Refund cheques were dispatched but not received by parents due to address issues and are now time-barred.","recommendation":"Student security should be refunded on a timely basis. As per policy: 'The cheque shall be dispatched through courier to the address provided on the forms by the parent/guardian.' A report/option in ISM/BEAMS should be available to PROs for monitoring security refund status.","audit_view":"It is requested to coordinate with IT for generating a branch-wise security refund report in BEAMS to enable more efficient tracking by branch PROs.","typical_response":"These are cases where refund was dispatched but not received and are now time-barred."},{"id":"OBS-045","title":"Registration Receipts for Exempt/Reduced Fee Students not Issued","category":"Student Record","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore"],"keywords":["exemption","registration receipt","exempt","employee children","pre-mature transfer","nil receipt"],"observation":"Registration receipts of students exempt from registration fee were not available. The practice of printing such receipts was not being followed.","recommendation":"As per policy: 'Registration Receipt (RR) shall also be issued to students who are exempted from registration fee e.g. employee children, pre-mature transfers. Such receipts shall be marked as Exempted along with the reason/basis.'","audit_view":"Issuing receipts even for exempted students creates a proper audit trail and prevents disputes.","typical_response":"Noted for future compliance."},{"id":"OBS-046","title":"Untraced Fixed Assets","category":"Fixed Assets","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore","Garden_Town_Lahore"],"keywords":["untraced","fixed assets","missing assets","physical verification","FAR","asset register"],"observation":"Assets appearing in the Fixed Assets Register could not be physically located by the concerned staff. Status regarding untraced assets from previous audit instances was also pending resolution.","recommendation":"As per policy: 'Principals/Branch Heads have the prime responsibility for the safe custody of the assets of the Company.' All untraced assets must be thoroughly investigated. AMCO and RO Fixed Assets department should be involved for resolution.","audit_view":"Concerned AMCO and RO Fixed Assets department is requested to look into the matter and resolve the issue at the earliest. Yearly stock take activity should include a comprehensive check of all previously untraced assets.","typical_response":"Already disposed off. Will trace and update."},{"id":"OBS-047","title":"Out of Order Assets","category":"Fixed Assets","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore","Clifton_Campus_Karachi","Garden_Town_Lahore"],"keywords":["out of order","broken","repair","disposal","AIDN","fixed assets"],"observation":"During physical verification, several assets were found out of order, broken, or non-functional. No action (repair or disposal through AIDN) had been initiated for many such assets.","recommendation":"Out of order/repairable assets should be repaired at the earliest. Assets beyond repair should be processed for disposal as per policy: 'Assets are sold when: Assets are beyond repair or where the cost of repair is considerably high; Assets are obsolete; Company for any other reason has no use of the assets.' AIDN should be processed without delay.","audit_view":"Maintaining out-of-order assets without action is a waste of resources and affects the branch's operational efficiency. A comprehensive audit of asset condition should be conducted and appropriate action taken promptly.","typical_response":"Will initiate AIDN for disposal/repair in coordination with RO."},{"id":"OBS-048","title":"Unmatched Assets Found in Branch","category":"Fixed Assets","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore","Garden_Town_Lahore"],"keywords":["unmatched","fixed assets","FAR","asset register","physically present","not in register"],"observation":"Some assets were physically present in the branch but were not appearing in the Fixed Assets Register. Source of receipt for these assets could not be determined.","recommendation":"The source from which these assets were received should be traced with the consultation of RO, and the fixed assets register should be updated accordingly. 'Fixed assets without codes or having unmatched codes shall not be transferred.'","audit_view":"Unmatched assets indicate control gaps in asset management. RO Fixed Assets department must be involved to update the register and assign proper codes.","typical_response":"Noted and will be rectified."},{"id":"OBS-049","title":"Un-Numbered Assets","category":"Fixed Assets","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore","Garden_Town_Lahore"],"keywords":["unnumbered","asset code","tag","numbering","fixed assets","identification"],"observation":"Some assets were found without fixed asset codes/numbers during physical verification. This makes it impossible to track assets and match them to the register.","recommendation":"Asset numbers should be affixed immediately. If numbers have not been received, GRNs should be checked and RO coordinated with. As per policy: 'Fixed assets shall affix codes on respective fixed assets within 15 days of receipt of fixed assets codes.'","audit_view":"Un-numbered assets cannot be effectively tracked or controlled. An urgent exercise to number all un-numbered assets should be conducted.","typical_response":"Noted and will be rectified."},{"id":"OBS-050","title":"Duplicate / Same Codes on Two Assets","category":"Fixed Assets","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore","Garden_Town_Lahore"],"keywords":["duplicate code","same code","fixed assets","numbering","double number"],"observation":"Some assets were observed with duplicate/same fixed asset codes affixed to more than one asset. This creates confusion in the register and physical verification process.","recommendation":"As per policy, unique codes should be assigned and affixed within 15 days of receipt. Duplicate codes must be investigated and corrected immediately by coordinating with RO Fixed Assets department.","audit_view":"Duplicate asset codes undermine the integrity of the fixed assets register. An immediate reconciliation with RO is required.","typical_response":"Activity still in process. Will be updated soon."},{"id":"OBS-051","title":"Physical Verification Report not Available","category":"Fixed Assets","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore"],"keywords":["physical verification","stock take","annual","report","fixed assets"],"observation":"Physical verification reports for fixed assets were not available in the branch. Annual physical verification as required by policy had not been conducted/documented.","recommendation":"The stock take reports should be retrieved for future reference. As per policy: 'Physical verification of all fixed assets (100%) shall be conducted at least once in a year.'","audit_view":"Annual physical verification is a fundamental internal control. Branch must ensure this is conducted and documented every year.","typical_response":"Noted for future compliance."},{"id":"OBS-052","title":"Fixed Asset Register — Missing Aspects and Columns","category":"Fixed Assets","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore","Clifton_Campus_Karachi"],"keywords":["FAR","fixed asset register","brand","model","make","GRN","supplier","columns"],"observation":"Only the category of assets was mentioned, but aspects containing description (Brand, Make, Model) were not available in the fixed asset register. Certain columns were left blank including GRN number, supplier name, invoice number, and PO reference.","recommendation":"In order to physically verify assets authentically, Brand, Make, Model, and other identifying information must be included in the FA Register. Complete information should be entered for all assets. This is now being addressed through the Oracle-based fixed assets dashboard.","audit_view":"Incomplete FA Register makes physical verification unreliable. In recent years, aspects of assets have been included following development of Oracle-based dashboard — this practice must be applied to all assets.","typical_response":"Referred to Regional Office."},{"id":"OBS-053","title":"List of Landlord/Canteen/Photocopier Assets not Available","category":"Fixed Assets","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore","Garden_Town_Lahore"],"keywords":["landlord assets","canteen assets","photocopier","contractor assets","third party assets","list"],"observation":"Detailed list of landlord/canteen contractor/photocopier assets in the branch premises was not available or not updated. Lists were not signed and verified by both parties.","recommendation":"Detail of landlord/contractor assets, duly signed by both parties, should be kept in the branch to differentiate the assets of the company from assets of the landlord/contractor. Lists should be updated whenever assets change.","audit_view":"Without a verified list of third-party assets, there is risk of company assets being removed or third-party assets being included in company records.","typical_response":"Will coordinate with ROC to identify. Noted for future compliance."},{"id":"OBS-054","title":"Assets Disposed Off but Still in FAR / Physically Present","category":"Fixed Assets","type":"New","campuses":["Garden_Town_Lahore"],"keywords":["disposal","AIDN","FAR","disposed","still present","asset register"],"observation":"Certain assets were disposed off against formal AIDN but were still appearing in the Fixed Assets Register. Additionally, some disposed assets were physically still present in the branch.","recommendation":"Assets disposed off should be removed from the Branch's FAR and should not be physically present in the branch after disposal. An immediate reconciliation of disposed assets with current FAR is required.","audit_view":"Discrepancy between disposal records and FAR/physical presence indicates control failure in asset disposal process. A comprehensive reconciliation must be conducted.","typical_response":"These assets have now been removed from the updated FAR."},{"id":"OBS-055","title":"High Item Per Child Book Ratio in Library","category":"Library","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore","Clifton_Campus_Karachi"],"keywords":["library","item per child","IPC","books","ratio","standard","excess books"],"observation":"Books per child ratio exceeded the prescribed standard of approximately 15 books per child. Ratios of 26.75 and 31.60 were observed against the standard of 15.","recommendation":"As per Library Manual clause 18.1: 'A school librarian should always be aware of her library material, student strength and items per child.' RO Librarian should monitor item per child ratios across all branches and facilitate transfer or disposal of excess books.","audit_view":"Excess books should be discussed with RO Librarian before any disposal decision. Excess books may be transferred to branches with lower IPC ratios or stored as per direction of RO.","typical_response":"We will discard old books."},{"id":"OBS-056","title":"Low Item Per Child Ratio in Library","category":"Library","type":"Repeated","campuses":["Garden_Town_Lahore"],"keywords":["library","item per child","IPC","books","ratio","low","insufficient"],"observation":"Book ratio per child was low in middle section library. As per the item per child report of June 30, 2025, only 4.53 books per student (middle) were available against the standard of 15 books per child.","recommendation":"As per Library Manual clause 18.1: 'A school librarian should always be aware of her library material, student strength and items per child.' Additional books should be procured as per budget to meet the prescribed ratio.","audit_view":"Low IPC ratio impacts the reading culture and educational experience. Budget planning for library books must be prioritized.","typical_response":"Will purchase books accordingly with budget in this session."},{"id":"OBS-057","title":"Delay in Return of Library Books","category":"Library","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore","Clifton_Campus_Karachi","Garden_Town_Lahore"],"keywords":["library","overdue books","return","delay","KOHA","students","teachers"],"observation":"Library books were not returned within the stipulated time by students and teachers. Books overdue exceeding 25 days and 100 days were identified. Outstanding books appearing on KOHA system not returned by students.","recommendation":"As per policy: 'A library book may be issued for a maximum period of two weeks at a time. Renewals may be permitted based on availability.' KOHA should be regularly monitored for overdue items. Reminders should be sent and follow-up calls made to parents.","audit_view":"A systematic reminder mechanism through KOHA should be implemented. Habitual non-return should be escalated to Branch Head.","typical_response":"Noted for future compliance. Now data has been updated."},{"id":"OBS-058","title":"Books not Entered in Library Module KOHA","category":"Library","type":"New","campuses":["Clifton_Campus_Karachi","Garden_Town_Lahore"],"keywords":["KOHA","library module","accession register","books not entered","barcode","library system"],"observation":"Around 150-600 books were not yet entered in the Library Module KOHA. In one branch, the librarian stated these books would be disposed off without being recorded.","recommendation":"Entry of library books in module should be completed for all books. All books should be accessible in the module on timely basis. Books below 1000 should be recorded in the relevant register instead of Main Accession Register.","audit_view":"Proper cataloguing of all books in KOHA is essential for effective library management and accurate IPC calculation.","typical_response":"Books were added to KOHA but physical labelling had not yet been completed."},{"id":"OBS-059","title":"Incomplete Barcode Labelling on Library Books","category":"Library","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore","Clifton_Campus_Karachi","Garden_Town_Lahore"],"keywords":["barcode","KOHA","label","library books","plastic cover"],"observation":"Barcode labels were not affixed on many library books. Barcode printer issues and worn-out plastic covers contributed to the problem.","recommendation":"Bar Codes (KOHA) should be pasted on all books on timely basis. As per email from Deputy Manager Libraries-South Nov 2018: 'KOHA will be implemented in all branches.' All books must have barcode labels before being placed on shelves.","audit_view":"Branch should ensure completeness of barcode labelling on all books. Since audit was performed on sample basis, a comprehensive review of all books is recommended.","typical_response":"Measures are being taken to resolve printer issues and re-labelling is in progress."},{"id":"OBS-060","title":"Library Books in Poor Condition / Torn Pages","category":"Library","type":"New","campuses":["Clifton_Campus_Karachi","Garden_Town_Lahore"],"keywords":["torn","damaged","library books","condition","repair","mending","plastic cover"],"observation":"Few library books were in bad condition with torn covers, torn-out pages, or missing titles. Books without plastic covers were deteriorating faster.","recommendation":"As per Library Manual Clause 8.1: 'To maintain efficient running of the school library, constant maintaining of resources should be an on-going procedure. Books should be mended, repaired, bound and re-bound so that they are maintained in a fit condition.' Books in very poor condition should be withdrawn from circulation and either repaired or disposed of.","audit_view":"Regular book maintenance and plastic coating is essential for preserving library resources. An annual book condition audit should be conducted.","typical_response":"Regular inspection and repair of books have been part of ongoing library practices."},{"id":"OBS-061","title":"Discrepancies in Cost of Books / Wrong Data in KOHA","category":"Library","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore"],"keywords":["KOHA","cost","accession register","wrong data","library","data entry"],"observation":"Books with the same title were recorded at significantly different costs in the Main Accession Register. Zero cost and incomplete data were appearing for books in KOHA. Certain columns were left blank or contained incorrect data.","recommendation":"Correct cost should be recorded for all books. Complete and correct information must be maintained in all library records. Branch Librarian must verify and correct all data discrepancies.","audit_view":"Accurate data in KOHA is fundamental for effective library management and valuation. A comprehensive data cleansing exercise should be undertaken.","typical_response":"Noted for future compliance. Data correction task has been started."},{"id":"OBS-062","title":"Transfer and Disposal of Books not Processed in KOHA","category":"Library","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore"],"keywords":["KOHA","transfer","disposal","books","AIDN","accession register"],"observation":"Books were physically transferred from the branch but were not recorded in the accession register even after lapse of five years. Disposal of books was not properly processed in KOHA with certain AIDNs pending.","recommendation":"Transfer notes and disposal processes should be completed within a reasonable time to ensure correct records and accurate IPC calculation.","audit_view":"Pending transfers and disposals distort the actual book count and IPC ratio. Immediate processing of all pending transactions is required.","typical_response":"Noted and task is in process."},{"id":"OBS-063","title":"Double Stacking of Books in Library","category":"Library","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore"],"keywords":["double stacking","library","books","display","shelving","stacking"],"observation":"Books were double stacked in the library. As per standard practice, double stacking should be avoided for proper display and easy access to books.","recommendation":"Proper stacking should be done as per policy and standard library practice. Books should be organized for maximum visibility and accessibility.","audit_view":"Double stacking makes it difficult to locate books and may damage them. Additional shelving or book reduction/transfer should be considered.","typical_response":"Noted for future compliance."},{"id":"OBS-064","title":"Library Record not Properly Maintained","category":"Library","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore","Garden_Town_Lahore"],"keywords":["library record","minutes","librarian meeting","reminders","clearance forms","librarian"],"observation":"Certain library records were not properly maintained: Minutes of Library Coordination Meeting not filed; Reminders file for overdue books not maintained; Library Clearance Forms not properly kept on record; File for minutes of librarian meeting with regional librarian not maintained.","recommendation":"As per Library Manual: 'Minutes of the Library Coordination Meeting should be filed by the librarian. A file should be maintained with a copy of Reminders issued to teachers/students for not returning books on time. Library Clearance forms should be kept on record properly.' Regional Librarian should call meetings at least once/twice per academic year.","audit_view":"Proper documentation of library activities ensures accountability
