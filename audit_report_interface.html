and effective monitoring.","typical_response":"Noted for future compliance."},{"id":"OBS-065","title":"Guards Strength Approved Copy not Available","category":"Safety & Security","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore"],"keywords":["security guards","approved strength","SLA","OPEX","guards number"],"observation":"Detail of approved quantity of security guards was not available in the branch. The SLA shared with branches did not mention the number of guards.","recommendation":"RO should communicate/intimate the branches regarding the approved/allowed number of security personnel in writing. Number of guards authorized as per approved OPEX sheet should be formally communicated.","audit_view":"Branch management should have documented approval for guard strength to ensure proper security coverage and cost control.","typical_response":"Email available in branch. Number of guards are authorized as per approved OPEX sheet."},{"id":"OBS-066","title":"Discrepancies in School Security","category":"Safety & Security","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore"],"keywords":["security","perimeter wall","barbed wire","visitor register","CNIC","ID card","CCTV","soft areas"],"observation":"Several security deficiencies identified: Visitor entries not properly recorded (CNIC, phone, signature, purpose missing); Perimeter wall not complying with minimum height of 8'+2' in certain areas; Trees and construction along perimeter wall create security vulnerabilities; Barbed wire only 1.5 feet in some areas instead of required 2 feet and was rusted; Staff not wearing employee ID cards; Common boundary walls of adjacent vacant plot were soft areas; Glass doors without grills in important areas; Walk-through gate and checking staff in close proximity leaving no reaction time.","recommendation":"School management should seek guidance from RO Security Department to address all identified deficiencies. Visitor entries must be complete and signed. Perimeter security must meet minimum standards.","audit_view":"Security deficiencies must be addressed as a priority given the school environment. A formal security audit by RO Security Department is recommended.","typical_response":"Noted for future compliance."},{"id":"OBS-067","title":"CCTV Recording Gaps","category":"Safety & Security","type":"New","campuses":["Clifton_Campus_Karachi"],"keywords":["CCTV","recording","gaps","surveillance","footage","cameras"],"observation":"CCTV camera recordings were missing on different dates and timings due to old CCTV cables causing cameras to go offline.","recommendation":"Branch should ensure uninterrupted backup of CCTV recordings. Old cables and faulty equipment should be replaced immediately. A proper maintenance schedule for CCTV equipment should be established.","audit_view":"Gaps in CCTV recordings compromise school security. Immediate rectification of cable/equipment issues is essential.","typical_response":"Due to old CCTV cables the cameras were off."},{"id":"OBS-068","title":"Annual Firing Practice not Conducted Regularly","category":"Safety & Security","type":"New","campuses":["Clifton_Campus_Karachi"],"keywords":["firing practice","security","weapon","armed guard","annual","training","pistol"],"observation":"First annual firing practice was conducted in 2019 followed by last practice in 2023 — a gap of more than four years without firing practice.","recommendation":"Regional annual firing practice should be conducted at the firing range at least once per year. As per Pistol Handling SOPs: 'At least one time fire is necessary in a year.' Official records must be maintained.","audit_view":"Regular firing practice is essential to maintain readiness and proficiency of armed security personnel. RO Security Department should ensure annual practice is conducted and recorded.","typical_response":"Security Department will work on obtaining additional ammunition for annual firing practice."},{"id":"OBS-069","title":"Discrepancies in Security Guard Documentation","category":"Safety & Security","type":"New","campuses":["Clifton_Campus_Karachi"],"keywords":["security guard","documents","guard records","age limit","contract","attendance","literacy"],"observation":"Multiple security guard documentation issues: Guards not within agreed age limit of 35-50 years as per contract; crucial documents of guards not available; security supervisor signing attendance on behalf of guards; guards possibly not adequately literate.","recommendation":"As per contract clause #4(b): 'Security guards will be preferably in the age group of 35-50 years.' All security guards should sign their own attendance sheets. Documentation of security guards must be accurate and complete. As per contract: 'Contractor will ensure that the deployed security guards are adequately educated.'","audit_view":"Contract compliance must be enforced with the security company. RO Security should verify guard documentation during routine checks.","typical_response":"Noted for future compliance."},{"id":"OBS-070","title":"Discrepancies in Weapon/Ammunition Register","category":"Safety & Security","type":"New","campuses":["Clifton_Campus_Karachi"],"keywords":["weapon","ammunition","register","pistol","SGSM","RSM","sign","cleaning log"],"observation":"Weapon In/Out register was not signed by SGSM/RSM on visits. Weekly weapon cleaning log book was also not signed by SGSM/RSM.","recommendation":"As per Pistol Handling SOPs: 'After duty timings, the weapon and its ammunition shall be placed in lock and key, and timing of in and out will be entered in the register.' 'This register will be presented to RSM Security/SGSM on every visit for counter sign.'","audit_view":"Proper weapon register maintenance and supervisory sign-off is essential for accountability and security compliance.","typical_response":"The relevant documents are being signed by Managers Security during their routine duties."},{"id":"OBS-071","title":"UPS not Available / Control Room Security Deficiencies","category":"Safety & Security","type":"New","campuses":["Clifton_Campus_Karachi"],"keywords":["UPS","control room","CCTV","power outage","surveillance","security room","shared"],"observation":"Control Room/Security Room was shared with OFA, making it a frequently visited area and compromising security of critical operations. The CCTV system was not automatically connected to UPS backup, requiring manual intervention during power outages.","recommendation":"Security Control Room should not be shared with general staff. It should be furnished with automatic UPS backup for uninterrupted surveillance. A separate UPS for CCTV/control room equipment should be provided.","audit_view":"An unsecured and shared control room with unreliable power backup represents a serious security vulnerability. Immediate corrective measures are required.","typical_response":"OFA office shifting is under process. Will demand separate UPS in upcoming CAPEX."},{"id":"OBS-072","title":"Security Guards Frequently Changed by Security Company","category":"Safety & Security","type":"Repeated","campuses":["Clifton_Campus_Karachi"],"keywords":["security guards","change","frequent","security company","familiar","guards pool"],"observation":"Security guards were frequently changed by the security company, making it difficult for the branch to remain familiar with the guards and creating security vulnerabilities.","recommendation":"As per policy: 'Ensure that security companies providing security guards maintain a separate pool of guards for BSS and do not change them frequently/at will.' Non-compliance should be escalated to RO Security.","audit_view":"Frequent guard changes undermine security by ensuring guards are unfamiliar with the premises and staff. Contract enforcement through RO Security is required.","typical_response":"Requested security company to change incompetent guards."},{"id":"OBS-073","title":"Ex-Armed Forces Personnel not Provided as per Contract","category":"Safety & Security","type":"New","campuses":["Garden_Town_Lahore"],"keywords":["ex-armed forces","security guard","contract","50%","armed guards","military"],"observation":"None of the 6 armed guards of the school had ex-armed forces background, while the Security Company contract requires 50% ex-armed forces personnel.","recommendation":"As per the contract: 'Security Company has to provide 50% ex-armed forces personnel.' The non-compliance of the security services contract should be reported to the concerned office and followed up until the issue is resolved.","audit_view":"Failure to provide ex-armed forces personnel as contractually required is a material breach of contract. RO should formally notify the security company and enforce compliance.","typical_response":"Noted for compliance."},{"id":"OBS-074","title":"Assembly Area Not Properly Marked","category":"Safety & Security","type":"New","campuses":["Garden_Town_Lahore"],"keywords":["assembly area","emergency","evacuation","fire drill","safety","sections","marked"],"observation":"Assembly area label was present in branch. However, designated assembly areas for specific groups (Primary Section, Middle Section, Senior Section, etc.) were not marked.","recommendation":"Assembly area should be clearly labelled and sectioned as per the emergency plan of the branch to ensure smooth and organized evacuation during emergencies.","audit_view":"Clearly marked section-specific assembly areas are critical for effective emergency response, especially in a school setting with students of different age groups.","typical_response":"Necessary steps will be taken in future."},{"id":"OBS-075","title":"No Scanning Room at Entry Gate","category":"Safety & Security","type":"New","campuses":["Garden_Town_Lahore"],"keywords":["scanning room","gate","visitor","security check","walkthrough","entry"],"observation":"There was no scanning room available at Gate No. 3, while a number of visitors, parents and students entered the branch from this gate. A walkthrough gate was installed and operational but no dedicated scanning room was available.","recommendation":"Scanning Room should be available at each entry point for visitors to ensure thorough security checks.","audit_view":"A dedicated scanning room at all entry points is essential for maintaining school security standards. RO civil team should be engaged for layout and budgeting.","typical_response":"Will discuss with RO civil team to arrange required budgeting for execution."},{"id":"OBS-076","title":"Discrepancies in Memorandum Registers","category":"Others","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore","Garden_Town_Lahore"],"keywords":["stock register","memorandum register","sports register","music register","stationery register","teaching aid","closing balance"],"observation":"Various stock register discrepancies observed: Registers not maintained for required categories (Music Equipment, Fixed Assets below threshold, Sports, Teaching Aid, Consumable Stationery); Closing balances calculated incorrectly; Receipts recorded in issued column; Register not validated by Branch Head; Physical stock not matched with records.","recommendation":"As per policy: 'For the purpose of effective control, certain stock registers shall be maintained by Branches.' All registers must be properly maintained with correct entries, closing balances, and monthly BH validation. Old Stock Registers for last 6 years shall be kept safe.","audit_view":"Properly maintained stock registers are essential for accountability and control over low-value items. Branch Head must verify and sign registers on a monthly basis.","typical_response":"Noted for future compliance."},{"id":"OBS-077","title":"Document Tracking Sheet not in Practice","category":"Others","type":"Repeated","campuses":["LMA11_FCC_Gulberg_Lahore","Garden_Town_Lahore"],"keywords":["document tracking sheet","DTS","documents","movement","departments","tracking"],"observation":"The branch was not in the practice of attaching the Document Tracking Sheet with documents being forwarded to different departments. This makes it difficult to track document movement and ensure timely delivery.","recommendation":"As per policy: 'DOCUMENT TRACKING SHEET shall be used on top of every such document(s) which involves movement within different organizational tiers or departments.' Important documents include GRNs, Transfer Notes, AIDNs for fixed assets, Final Settlement cases, and Reimbursement claims.","audit_view":"Document tracking sheets ensure accountability for document movement and help prevent loss of important records.","typical_response":"Noted for future compliance."},{"id":"OBS-078","title":"Generator Log Book not Properly Maintained","category":"Others","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore"],"keywords":["generator","log book","fuel","diesel","maintenance","OFA","logbook"],"observation":"Generator log book was not properly maintained: Usage detail not properly updated; person making ON/OFF entry not signing; No proper record in logbooks before Sep 2023; Maintenance not recorded in Logbook; Repairs/Out of order of Generator not recorded. Fuel average monitoring was also not conducted.","recommendation":"As per policy: 'OFA/AO shall maintain the record (logbook & invoices) pertinent to generator operations including fueling.' The following information shall be recorded daily: Date & time of diesel re-filling; Quantity of fuel filled; Meter readings; Running hours; Fuel average; Replacement of parts; Detail of other maintenance activities.","audit_view":"A properly maintained generator logbook is essential for monitoring fuel consumption, maintenance compliance, and equipment longevity.","typical_response":"Noted for future compliance."},{"id":"OBS-079","title":"Demolition Register not Maintained","category":"Others","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore","Garden_Town_Lahore"],"keywords":["demolition register","OFA","construction","works department","register"],"observation":"Demolition register was not being maintained at the branch.","recommendation":"As per policy: 'A demolition register shall be maintained at the Branch by the Officer Facility Administration or designated person, and should be vetted by the BH and designated Official of Construction/Works department RO.'","audit_view":"Demolition register is important for tracking any demolition/construction work at the branch premises.","typical_response":"Will be properly maintained and verified from ROC concerned officials."},{"id":"OBS-080","title":"Discrepancies in Daycare Facility","category":"Others","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore"],"keywords":["daycare","enrollment","CCTV","fire alarm","smoke detector","fire extinguisher","first aid","refrigerator","infants"],"observation":"Multiple daycare facility deficiencies: Daycare enrollment forms not available; CCTV camera blind spots in daycare; No telephone extension; No warning device for fire alarm; No smoke detector; No fire extinguisher; No first-aid kit; No refrigerator; Space for infants and children of other ages not separated.","recommendation":"As per Daycare Policy: Parents must complete enrollment forms; CCTV must cover daycare completely; daycare must have a telephone extension; early warning device for fire alarm must be provided; operable smoke detector must be placed in daycare room; fire extinguisher must be intact and accessible; first-aid kit must be available; clean refrigerator must be provided; space for infants must be separate from spaces for children of other ages.","audit_view":"Daycare facility deficiencies pose significant safety and liability risks. All non-compliant items must be addressed immediately as these relate directly to child safety.","typical_response":"Noted for future compliance."},{"id":"OBS-081","title":"Inward Gate Pass not in Practice","category":"Others","type":"New","campuses":["LMA11_FCC_Gulberg_Lahore"],"keywords":["gate pass","inward","outward","asset movement","control","receipt"],"observation":"The practice of preparing inward gate passes for assets/items received was not implemented. This reduces visibility over inward movement of assets and items.","recommendation":"Gate pass system should be implemented for both inward and outward movements to ensure efficient monitoring and provide evidence of receipt of assets. Gate passes should be authorized, sequential, and properly documented.","audit_view":"A gate pass system provides essential control over asset movement. Both inward and outward movements must be documented with authorized gate passes.","typical_response":"Noted for future compliance."},{"id":"OBS-082","title":"Renewed School Business Registration Not Available","category":"Others","type":"New","campuses":["Clifton_Campus_Karachi"],"keywords":["school registration","business registration","Education Department","license","expired","renewal"],"observation":"School Business Registration had expired on 09/07/2022 and the renewed certificate was not available. This exposes the school to regulatory non-compliance.","recommendation":"Registration of Education & Literacy Department should be renewed on a timely basis. RO Admin should provide a copy of the renewed school registration certificate to the branch.","audit_view":"Operating without a valid school business registration is a regulatory violation. Immediate renewal and provision of certificate to branch is required.","typical_response":"Noted for compliance."},{"id":"OBS-083","title":"Printed Stationery Register not Maintained","category":"Others","type":"New","campuses":["Clifton_Campus_Karachi"],"keywords":["stationery register","printed stationery","register","stock","BH signature"],"observation":"Printed stationery register was not maintained. Quarterly verification and signing by Branch Head was not being done.","recommendation":"As per policy: 'Printed Stationery register shall be checked and signed by the Branch Head, quarterly.' The officer authorized by BH shall be responsible for checking receipt and issuance of printed stationery stock against acknowledgement.","audit_view":"Printed stationery register is a control over pre-printed documents. Its absence creates risk of unauthorized use of official stationery.","typical_response":"Noted for future compliance."},{"id":"OBS-084","title":"Chart of Account Needs Correction","category":"Branch Imprest, Payments & Accounts","type":"Repeated","campuses":["Clifton_Campus_Karachi"],"keywords":["chart of accounts","COA","accounts","parent category","advance to suppliers","accounting"],"observation":"Sub accounts were opened in inappropriate parent category of 'Advance to Suppliers'. Accountants at branch level only have rights to open accounts in certain categories, creating structural issues in the COA.","recommendation":"To present a fair view of accounts, the concerned heads should be revised and transferred to related parent head categories. RO Finance should consult HO Finance/IT for resolution of the system constraint.","audit_view":"RO Finance department should consult HO Finance/IT department for the resolution of the system constraint that forces incorrect account creation.","typical_response":"Accountants at branch level only have rights to open accounts in Advance to Supplier, Banks and Advance to Staff."},{"id":"OBS-085","title":"Science Laboratory Stock Register Discrepancies","category":"Science Laboratory","type":"Repeated","campuses":["Garden_Town_Lahore"],"keywords":["laboratory","science lab","stock register","physical stock","verification","BH validation","consumption"],"observation":"Laboratory stock registers were not validated by Branch Head; stock was not kept systematically with items from one lab kept in another; physical stock did not match with records; actual consumption not recorded on actual basis (stocktake on intervals with difference posted as consumption).","recommendation":"As per policy: 'Branch Head shall verify the laboratory registers on monthly basis.' Physical balance should be matched with records. Consumption should be recorded on actual basis.","audit_view":"Discrepancies in laboratory stock registers indicate poor asset management in laboratories. Monthly BH validation is mandatory.","typical_response":"Laboratory In-charges have been instructed to maintain records regularly. BH will now validate and sign registers monthly."},{"id":"OBS-086","title":"Track Record of Quotations not Maintained","category":"Branch Imprest, Payments & Accounts","type":"New","campuses":["Garden_Town_Lahore"],"keywords":["quotation","track record","procurement","100000","1 lac","procurement file","BPC"],"observation":"For procurements valuing more than Rs. 100,000, track records of quotations were not being kept by the branch. Purchase Requisition file was also not maintained.","recommendation":"As per policy: 'For Procurements valuing more than Rs. 100,000 a track of quotations received shall be maintained at Branch duly authenticated by PC to ensure that all quotations received are properly accounted for.' PR file must be maintained with copies of all PRs.","audit_view":"Track record of quotations above PKR 100,000 is essential for procurement transparency and auditability.","typical_response":"A proper filing system has now been implemented."},{"id":"OBS-087","title":"Balance Confirmation Certificates not Obtained","category":"Branch Imprest, Payments & Accounts","type":"Repeated","campuses":["Garden_Town_Lahore"],"keywords":["balance confirmation","vendors","payables","receivables","reconciliation","creditors"],"observation":"Branch was unable to provide certain balance confirmation certificates from vendors/suppliers. A vendor (M/s Rang Studio) claimed Rs. 60,000 as receivable from the Branch while branch records show no amount payable.","recommendation":"For clarity of payables/receivables recorded in books of account, balance confirmation certificates should be obtained from all vendors at regular intervals. Discrepancies must be promptly investigated and reconciled.","audit_view":"The difference of Rs. 60,000 with M/S Rang Studio should be reconciled and books of account updated at the earliest. Balance confirmation should be obtained within specified time limits.","typical_response":"Most vendors ignore this request. Regarding M/s Rang Studio, as per our record no amount is payable."}]}
</script>

<script>
// ============================================================
// LOAD DATA from safe JSON tag
// ============================================================
var DB = JSON.parse(document.getElementById('audit-data').textContent);

// ============================================================
// STORAGE HELPERS
// ============================================================
var STORE_VER = 'v6';
function sg(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function ss(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
(function(){
  if(sg('bhs_v','')!==STORE_VER){
    ['bhs_v','bhs_br','bhs_pb','bhs_ty','bhs_ca'].forEach(function(k){try{localStorage.removeItem(k);}catch(e){}});
    ss('bhs_v',STORE_VER);
  }
})();

// ============================================================
// INITIAL DATA  (populated from data bank)
// ============================================================
var DEF_PB=['Internal Audit Team','Senior Auditor','Assistant Auditor','Regional Audit Officer'];
var DEF_TY=['All Types'].concat(["New", "Repeated"]);
var DEF_CA=['All Categories'].concat(["Branch Imprest, Payments & Accounts", "Cash and Bank", "Fixed Assets", "Library", "Others", "Recruitment, Payroll & Employee Record", "Safety & Security", "Science Laboratory", "Student Record"]);

// ============================================================
// APP STATE
// ============================================================
var PREPBY   = sg('bhs_pb', DEF_PB);
var TYPES    = sg('bhs_ty', DEF_TY);
var CATS     = sg('bhs_ca', DEF_CA);

var selIds   = {};   // {obsId: true}
var annexMap = {};   // {obsId: "text"}
var avMap    = {};   // {obsId: manual audit view text}
var actMap   = {};   // {obsId: action taken text}
var customs  = [];
var cOpen    = false;
var curM     = null;

// ============================================================
// INIT
// ============================================================
window.onload = function() {
  buildSel('spb', PREPBY);
  buildSel('styp', TYPES);
  buildSel('scat', CATS);
  var d = new Date();
  document.getElementById('rdt').value = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  document.getElementById('qinp').addEventListener('keydown', function(e){
    if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();applyFilter();}
  });
  applyFilter(); // show all observations on load
};

function pad(n){return n<10?'0'+n:n;}

// ============================================================
// DROPDOWN BUILDERS
// ============================================================
function buildSel(id, arr) {
  var sel = document.getElementById(id);
  if(!sel) return;
  var prev = sel.value;
  sel.innerHTML = '';
  for(var i=0;i<arr.length;i++){
    var o=document.createElement('option');
    o.value=arr[i]; o.textContent=arr[i];
    sel.appendChild(o);
  }
  for(var j=0;j<sel.options.length;j++){
    if(sel.options[j].value===prev){sel.value=prev;break;}
  }
}

// ============================================================
// FILTER / SEARCH  (shows ALL obs on load; narrows with filters)
// ============================================================
function applyFilter() {
  var typeF = document.getElementById('styp').value;
  var catF  = document.getElementById('scat').value;
  var q     = document.getElementById('qinp').value.trim();
  var toks  = q ? tokenize(q) : [];

  var res = [];
  for(var i=0;i<DB.observations.length;i++){
    var o = DB.observations[i];
    if(typeF!=='All Types' && o.type!==typeF) continue;
    if(catF!=='All Categories' && o.category!==catF) continue;
    if(toks.length>0 && scoreObs(o,toks)===0) continue;
    res.push(o);
  }

  // Sort by score if search active
  if(toks.length>0){
    res.sort(function(a,b){return scoreObs(b,toks)-scoreObs(a,toks);});
  }

  renderList(res, toks, toks.length>0);
}

function renderList(obs, toks, showScore) {
  var list = document.getElementById('rlist');
  list.innerHTML = '';
  document.getElementById('nores').style.display = obs.length ? 'none' : 'block';
  document.getElementById('rcount').textContent = '(' + obs.length + ' observations)';
  document.getElementById('selbtns').style.display = obs.length ? 'flex' : 'none';

  var maxS = 1;
  if(showScore && obs.length){
    maxS = scoreObs(obs[0], toks) || 1;
  }

  for(var i=0;i<obs.length;i++){
    (function(o){
      var s = showScore ? scoreObs(o, toks) : 0;
      var pct = showScore ? Math.round((s/maxS)*100) : 100;
      var chk = selIds[o.id] ? ' checked' : '';
      var sel = selIds[o.id] ? ' on' : '';
      var tc = (o.type||'new').toLowerCase();
      var axv = annexMap[o.id] || '';

      var div = document.createElement('div');
      div.className = 'ri' + sel;
      div.id = 'ri-' + o.id;

      var inner = '<div class="ritop">';
      inner += '<input type="checkbox" class="ricb" id="cb-'+o.id+'"'+chk+' onclick="cbChg(event,\''+o.id+'\')">';
      inner += '<div class="rimeta">';
      inner += '<div class="ritl">'+hlText(esc(o.title),toks)+'</div>';
      inner += '<div class="risub">'+esc(o.category)+' <span class="badge '+tc+'">'+esc(o.type)+'</span></div>';
      if(showScore){
        inner += '<div class="rscore"><div class="rscorebar" style="width:'+pct+'%"></div></div>';
      }
      inner += '</div></div>';

      if(selIds[o.id]){
        inner += '<div class="axrow" id="ax-'+o.id+'">';
        inner += '<label>Annexure Data:</label>';
        inner += '<input type="text" value="'+esc(axv)+'" placeholder="e.g. Annexure-A, Jan 2025" oninput="setAx(\''+o.id+'\',this.value)" onclick="event.stopPropagation()">';
        inner += '</div>';
      }

      div.innerHTML = inner;

      // Click anywhere on row to toggle
      div.addEventListener('click', function(e){
        if(e.target.tagName==='INPUT') return;
        var cb = document.getElementById('cb-'+o.id);
        cb.checked = !cb.checked;
        handleSel(o.id, cb.checked, div);
      });

      list.appendChild(div);
    })(obs[i]);
  }
}

function cbChg(e, id) {
  e.stopPropagation();
  var div = document.getElementById('ri-'+id);
  handleSel(id, e.target.checked, div);
}

function handleSel(id, checked, div) {
  if(checked){ selIds[id]=true; } else { delete selIds[id]; }
  if(div){
    div.className = 'ri' + (checked?' on':'');
    var ax = document.getElementById('ax-'+id);
    if(checked && !ax){
      var row = document.createElement('div');
      row.className='axrow'; row.id='ax-'+id;
      row.innerHTML='<label>Annexure Data:</label><input type="text" value="'+esc(annexMap[id]||'')+'" placeholder="e.g. Annexure-A, Jan 2025" oninput="setAx(\''+id+'\',this.value)" onclick="event.stopPropagation()">';
      div.appendChild(row);
    } else if(!checked && ax){ ax.parentNode.removeChild(ax); }
  }
}

function setAx(id,v){ annexMap[id]=v; }

function selAll(state) {
  var items = document.querySelectorAll('.ri');
  for(var i=0;i<items.length;i++){
    var id = items[i].id.replace('ri-','');
    var cb = document.getElementById('cb-'+id);
    if(cb && cb.checked!==state){ cb.checked=state; handleSel(id,state,items[i]); }
  }
}

// ============================================================
// SCORING
// ============================================================
function tokenize(s){
  return s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(' ').filter(function(t){return t.length>1;});
}

function scoreObs(o, toks) {
  var hay = [o.title||'', o.observation||'', o.recommendation||'', o.audit_view||'',
             (o.keywords||[]).join(' '), o.category||''].join(' ').toLowerCase();
  var s=0;
  for(var i=0;i<toks.length;i++){
    var t=toks[i];
    var kws=o.keywords||[];
    var km=false;
    for(var j=0;j<kws.length;j++){
      if(kws[j].toLowerCase()===t){s+=3;km=true;break;}
      else if(kws[j].toLowerCase().indexOf(t)>=0){s+=2;km=true;break;}
    }
    if(!km){
      if((o.title||'').toLowerCase().indexOf(t)>=0) s+=2;
      else if(hay.indexOf(t)>=0) s+=1;
    }
  }
  return s;
}

function esc(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function hlText(safe, toks) {
  if(!toks||!toks.length) return safe;
  for(var i=0;i<toks.length;i++){
    var t=toks[i];
    var lo=safe.toLowerCase();
    var out=''; var p=0;
    while(p<safe.length){
      var idx=lo.indexOf(t,p);
      if(idx<0){out+=safe.slice(p);break;}
      out+=safe.slice(p,idx)+'<mark>'+safe.slice(idx,idx+t.length)+'</mark>';
      p=idx+t.length;
    }
    safe=out;
  }
  return safe;
}

// CUSTOM OBS
// ============================================================
function toggleC(){
  cOpen=!cOpen;
  document.getElementById('cfrm').style.display=cOpen?'block':'none';
  document.getElementById('ctgl').innerHTML=(cOpen?'&#9660;':'&#9654;')+' Add Custom Observation';
}

function addCustom(){
  var t=document.getElementById('ctit').value.trim();
  if(!t){toast('Please enter a title.');return;}
  var o={
    id:'C'+Date.now(),
    title:t,
    category:document.getElementById('ccat').value.trim()||'Others',
    type:document.getElementById('ctyp').value,
    observation:document.getElementById('cobs').value.trim(),
    recommendation:document.getElementById('crec').value.trim(),
    audit_view:document.getElementById('cav').value.trim(),
    _annex:document.getElementById('cannex').value.trim(),
    keywords:[],custom:true
  };
  customs.push(o);
  selIds[o.id]=true;
  if(o._annex) annexMap[o.id]=o._annex;
  ['ctit','ccat','cobs','crec','cav','cannex'].forEach(function(id){document.getElementById(id).value='';});
  toast('Custom observation added.');
  renderRpt();
}

// ============================================================
// REPORT RENDER
// ============================================================
function renderRpt(){
  var brcode  = document.getElementById('brcode').value.trim();
  var brname  = document.getElementById('brname').value.trim();
  var brregion= document.getElementById('brregion').value.trim();
  var brautype= document.getElementById('brautype').value.trim();
  var brvisit = document.getElementById('brvisit').value.trim();
  var brprev  = document.getElementById('brprev').value.trim();
  var brfwk   = document.getElementById('brfwk').value.trim();
  var rno     = document.getElementById('rno').value.trim();
  var pb      = document.getElementById('spb').value;
  var dt      = document.getElementById('rdt').value;
  var per     = document.getElementById('rper').value.trim();

  var dbObs=[]; for(var j=0;j<DB.observations.length;j++){if(selIds[DB.observations[j].id])dbObs.push(DB.observations[j]);}
  var cuObs=[]; for(var k=0;k<customs.length;k++){if(selIds[customs[k].id])cuObs.push(customs[k]);}
  var all=dbObs.concat(cuObs);

  var empty=document.getElementById('rpempty');
  var cont =document.getElementById('rpcont');

  var hasHeader = brcode||brname||rno||pb||dt||per;
  if(!all.length && !hasHeader){empty.style.display='block';cont.style.display='none';return;}
  empty.style.display='none'; cont.style.display='block';

  // Group by category
  var cats={}; var catOrder=[];
  for(var a=0;a<all.length;a++){
    var c=all[a].category||'Others';
    if(!cats[c]){cats[c]=[];catOrder.push(c);}
    cats[c].push(all[a]);
  }

  function fmtDt(s){
    if(!s)return '';
    var d=new Date(s); if(isNaN(d))return s;
    return d.toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});
  }

  var h='';
  h+='<div class="rhdr">';
  h+='<div class="rlogo">Beaconhouse School System &nbsp;|&nbsp; Internal Audit</div>';
  h+='<h1>AUDIT REPORT</h1>';
  if(brcode||brname) h+='<h2>'+(brcode?esc(brcode)+' – ':'')+esc(brname)+'</h2>';
  h+='<div class="rmeta">';
  if(rno) h+='<div><strong>Report No.:</strong> '+esc(rno)+'</div>'; else h+='<div></div>';
  if(dt)  h+='<div><strong>Date:</strong> '+fmtDt(dt)+'</div>';     else h+='<div></div>';
  if(pb)  h+='<div><strong>Prepared By:</strong> '+esc(pb)+'</div>'; else h+='<div></div>';
  if(per) h+='<div><strong>Audit Period:</strong> '+esc(per)+'</div>'; else h+='<div></div>';
  h+='</div></div>';

  // MIS box — show whenever any MIS field is filled
  var misFields=[brname,brregion,brautype,per,brvisit,brprev,brfwk];
  var hasMis=misFields.some(function(v){return !!v;});
  if(hasMis){
    h+='<div class="misbox"><h3>Branch Information (MIS)</h3><div class="misg">';
    if(brname)   h+='<div><strong>Branch:</strong> '+esc(brname)+'</div>';
    if(brregion) h+='<div><strong>Region:</strong> '+esc(brregion)+'</div>';
    if(brautype) h+='<div><strong>Audit Type:</strong> '+esc(brautype)+'</div>';
    if(per)      h+='<div><strong>Audit Period:</strong> '+esc(per)+'</div>';
    if(brvisit)  h+='<div><strong>Visit Dates:</strong> '+esc(brvisit)+'</div>';
    if(brprev)   h+='<div><strong>Prev. Report:</strong> '+esc(brprev)+'</div>';
    if(brfwk)    h+='<div><strong>Framework:</strong> '+esc(brfwk)+'</div>';
    h+='</div></div>';
  }

  if(!all.length){
    h+='<p style="color:var(--gtxt);text-align:center;padding:26px">No observations selected. Tick observations in the left panel.</p>';
    cont.innerHTML=h; return;
  }

  var num=0;
  for(var ci=0;ci<catOrder.length;ci++){
    var cat=catOrder[ci];
    h+='<div class="catg"><div class="cattl">'+esc(cat)+'</div>';
    var obs=cats[cat];
    for(var oi=0;oi<obs.length;oi++){
      num++;
      var o=obs[oi];
      var tc=(o.type||'new').toLowerCase();
      var ax=annexMap[o.id]||o._annex||'';
      var resp=''; var re=document.getElementById('r-'+o.id); if(re)resp=re.value;
      if(!resp&&o.typical_response)resp=o.typical_response;
      h+='<div class="oc '+tc+'">';
      h+='<div class="och"><span class="onum">Obs. '+num+'</span>';
      h+='<span class="otl">'+esc(o.title)+' <span class="badge '+tc+'">'+esc(o.type)+'</span></span>';
      h+='<button class="odl" onclick="remObs(\''+o.id+'\')">&#10005;</button></div>';
      h+='<div class="ocb">';
      var avMode=document.querySelector('input[name="avmode"]:checked');
      var avVal=avMode?avMode.value:'auto';
      var avStored=avMap[o.id]||'';
      var actStored=actMap[o.id]||'';

      // 1. Observation
      if(o.observation) h+='<div class="osl">Observation</div><div class="ost">'+esc(o.observation)+'</div>';
      // 2. Recommendation
      if(o.recommendation) h+='<div class="osl">Recommendation</div><div class="ost">'+esc(o.recommendation)+'</div>';
      // 3. Annexure Data (if set)
      if(ax) h+='<div class="oax"><strong>Annexure Data:</strong> '+esc(ax)+'</div>';
      // 4. Auditee Response — blank when Hide mode, pre-filled otherwise
      h+='<div class="osl">Auditee Response</div>';
      h+='<textarea class="oresp" id="r-'+o.id+'" placeholder="Enter auditee response...">'+esc(avVal==='none'?'':resp)+'</textarea>';
      // 5. Audit View — after Auditee Response
      if(avVal==='auto'&&o.audit_view) h+='<div class="osl">Audit View</div><div class="ost">'+esc(o.audit_view)+'</div>';
      else if(avVal==='manual') h+='<div class="osl">Audit View</div><textarea class="oresp" id="av-'+o.id+'" placeholder="Type audit view here..." oninput="avMap[\''+o.id+'\']=this.value">'+esc(avStored)+'</textarea>';
      // 6. Action Taken — always present
      h+='<div class="osl">Action Taken</div>';
      h+='<textarea class="oresp" id="act-'+o.id+'" placeholder="Enter action taken..." oninput="actMap[\''+o.id+'\']=this.value">'+esc(actStored)+'</textarea>';
      h+='</div></div>';
    }
    h+='</div>';
  }

  cont.innerHTML=h;
}

function remObs(id){
  delete selIds[id];
  customs=customs.filter(function(o){return o.id!==id;});
  var ri=document.getElementById('ri-'+id);
  if(ri){
    var cb=document.getElementById('cb-'+id);
    if(cb)cb.checked=false;
    ri.className='ri';
    var ax=document.getElementById('ax-'+id);
    if(ax)ax.parentNode.removeChild(ax);
  }
  renderRpt();
}

// ============================================================
// MODALS
// ============================================================
function openM(type){
  curM=type;
  var titles={branch:'Manage Branches',prepby:'Manage Auditor Names',type:'Manage Observation Types',cat:'Manage Categories'};
  document.getElementById('mtit').textContent=titles[type]||'Manage';
  document.getElementById('movl').className='show';
  var b=document.getElementById('mbdy');
  if(type==='branch') renderBrM(b);
  else renderListM(b,type);
}

function closeM(){document.getElementById('movl').className='';curM=null;}
function movlClick(e){if(e.target===document.getElementById('movl'))closeM();}

function renderBrM(b){
  var h='';
  for(var i=0;i<BRANCHES.length;i++){
    h+='<div class="mit" id="brow'+i+'">';
    h+='<span class="mitlb" id="blab'+i+'"><strong>'+esc(BRANCHES[i].code)+'</strong> – '+esc(BRANCHES[i].name)+'</span>';
    h+='<div id="bedit'+i+'" style="display:none;flex:1;gap:4px">';
    h+='<input class="cdinp" id="bcode'+i+'" value="'+esc(BRANCHES[i].code)+'" placeholder="Code">';
    h+='<input style="flex:1" id="bname'+i+'" value="'+esc(BRANCHES[i].name)+'" placeholder="Name">';
    h+='</div>';
    h+='<button class="mib e" id="bbtn'+i+'" onclick="editBr('+i+')">Edit</button>';
    h+='<button class="mib d" onclick="delBr('+i+')">Delete</button>';
    h+='</div>';
  }
  h+='<div class="madd"><input id="nbcode" class="cdinp" placeholder="Code"><input id="nbname" placeholder="Branch Name" style="flex:1"><button class="mabtn" onclick="addBr()">Add</button></div>';
  b.innerHTML=h;
}

function editBr(i){
  var lab=document.getElementById('blab'+i);
  var ed=document.getElementById('bedit'+i);
  var btn=document.getElementById('bbtn'+i);
  if(!lab||!ed)return;
  if(ed.style.display==='none'||ed.style.display===''){
    lab.style.display='none'; ed.style.display='flex'; btn.textContent='Save';
  } else {
    var code=document.getElementById('bcode'+i).value.trim();
    var name=document.getElementById('bname'+i).value.trim();
    if(!code||!name){toast('Code and name required.');return;}
    BRANCHES[i].code=code; BRANCHES[i].name=name; ss('bhs_br',BRANCHES);
    buildBrSel(); renderRpt();
    lab.innerHTML='<strong>'+esc(code)+'</strong> – '+esc(name);
    lab.style.display=''; ed.style.display='none'; btn.textContent='Edit';
  }
}

function delBr(i){
  if(!confirm('Delete branch "'+BRANCHES[i].name+'"?'))return;
  BRANCHES.splice(i,1); ss('bhs_br',BRANCHES); buildBrSel(); openM('branch');
}

function addBr(){
  var code=document.getElementById('nbcode').value.trim();
  var name=document.getElementById('nbname').value.trim();
  if(!code||!name){toast('Enter code and name.');return;}
  BRANCHES.push({id:'B'+Date.now(),code:code,name:name}); ss('bhs_br',BRANCHES);
  buildBrSel(); openM('branch'); toast('Branch added.');
}

function getArr(k){return k==='prepby'?PREPBY:k==='type'?TYPES:CATS;}
function saveArr(k,a){
  if(k==='prepby'){PREPBY=a;ss('bhs_pb',a);buildSel('spb',a);}
  else if(k==='type'){TYPES=a;ss('bhs_ty',a);buildSel('styp',a);}
  else{CATS=a;ss('bhs_ca',a);buildSel('scat',a);}
}

function renderListM(b, key){
  var arr=getArr(key);
  var h='';
  for(var i=0;i<arr.length;i++){
    h+='<div class="mit" id="lrow'+key+i+'">';
    h+='<span class="mitlb" id="llib'+key+i+'">'+esc(arr[i])+'</span>';
    h+='<input class="mitinp" id="linp'+key+i+'" value="'+esc(arr[i])+'">';
    h+='<button class="mib e" id="lbtn'+key+i+'" onclick="editIt(\''+key+'\','+i+')">Edit</button>';
    h+='<button class="mib d" onclick="delIt(\''+key+'\','+i+')">Delete</button>';
    h+='</div>';
  }
  h+='<div class="madd"><input id="nadd'+key+'" placeholder="New item" style="flex:1"><button class="mabtn" onclick="addIt(\''+key+'\')">Add</button></div>';
  b.innerHTML=h;
}

function editIt(key,i){
  var lab=document.getElementById('llib'+key+i);
  var inp=document.getElementById('linp'+key+i);
  var btn=document.getElementById('lbtn'+key+i);
  if(!lab||!inp)return;
  if(inp.style.display==='block'){
    var v=inp.value.trim();
    if(!v){toast('Cannot be empty.');return;}
    var a=getArr(key); a[i]=v; saveArr(key,a);
    lab.textContent=v; lab.style.display=''; inp.style.display='none'; btn.textContent='Edit';
  } else {
    lab.style.display='none'; inp.style.display='block'; inp.focus(); btn.textContent='Save';
  }
}

function delIt(key,i){
  var a=getArr(key); a.splice(i,1); saveArr(key,a); openM(key);
}

function addIt(key){
  var v=document.getElementById('nadd'+key).value.trim();
  if(!v){toast('Please enter a value.');return;}
  var a=getArr(key); a.push(v); saveArr(key,a); openM(key); toast('Added.');
}

// ============================================================
// TOOLBAR
// ============================================================
function doPrint(){renderRpt();setTimeout(function(){window.print();},200);}
function doCopy(){
  var c=document.getElementById('rpcont');
  if(!c||c.style.display==='none'){toast('Generate report first.');return;}
  navigator.clipboard.writeText(c.innerText||'').then(function(){toast('Copied to clipboard.');});
}
function doClear(){
  if(!confirm('Clear all selections?'))return;
  selIds={}; annexMap={}; customs=[];
  document.getElementById('qinp').value='';
  document.getElementById('styp').value='All Types';
  document.getElementById('scat').value='All Categories';
  document.getElementById('rpcont').style.display='none';
  document.getElementById('rpempty').style.display='block';
  applyFilter();
  toast('Cleared.');
}

// ============================================================
// TOAST
// ============================================================
function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg; el.className='show';
  setTimeout(function(){el.className='';},2800);
}
