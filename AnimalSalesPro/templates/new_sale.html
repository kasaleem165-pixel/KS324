{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:680px; margin:0 auto;">
  <h2>Record New Sale</h2>
  <form method="POST">
    <div class="form-grid">
      <div class="form-group">
        <label>Animal Code *</label>
        <select name="animal_code" id="animalSelect" required onchange="updateWeight()">
          <option value="">-- Select Animal --</option>
          {% for a in animals %}
          <option value="{{ a.code }}"
                  data-weight="{{ a.weight_final or '' }}"
                  data-type="{{ a.age_type or '' }}">
            Code: {{ a.code }} | {{ a.age_type or '' }} | {{ a.weight_final or '?' }} kg
          </option>
          {% endfor %}
        </select>
        {% if not animals %}
        <span class="hint" style="color:#dc2626;">No available animals. <a href="/animals/add">Add animals first</a>.</span>
        {% endif %}
      </div>
      <div class="form-group">
        <label>Customer *</label>
        <select name="customer_id" required>
          <option value="">-- Select Customer --</option>
          {% for c in customers %}
          <option value="{{ c.id }}">{{ c.name }}</option>
          {% endfor %}
        </select>
        {% if not customers %}
        <span class="hint" style="color:#dc2626;">No customers. <a href="/customers/add">Add customer first</a>.</span>
        {% endif %}
      </div>
      <div class="form-group">
        <label>Weight at Sale (kg) *</label>
        <input name="weight_at_sale" id="weightField" type="number" step="0.1" required
               placeholder="Final measured weight">
      </div>
      <div class="form-group">
        <label>Rate per kg (Rs.) *</label>
        <input name="rate_per_kg" type="number" step="1" required
               value="{{ default_rate }}" oninput="calcTotal()">
      </div>
      <div class="form-group">
        <label>Expenses (Rs.)</label>
        <input name="expenses" type="number" step="1" value="{{ default_expenses }}" oninput="calcTotal()">
        <span class="hint">Admin charges, transport, etc.</span>
      </div>
      <div class="form-group">
        <label>Total Amount (Rs.)</label>
        <input id="totalDisplay" readonly style="background:#f8fafc; font-weight:700; font-size:1rem;" placeholder="Auto-calculated">
      </div>
      <div class="form-group full">
        <label>Notes</label>
        <textarea name="notes" rows="2" placeholder="Optional notes"></textarea>
      </div>
    </div>
    <div style="display:flex; gap:12px; margin-top:20px;">
      <button type="submit" class="btn btn-success" {{ 'disabled' if not animals or not customers else '' }}>
        Record Sale &amp; Generate Receipt
      </button>
      <a href="/sales" class="btn" style="background:#e2e8f0; color:#444;">Cancel</a>
    </div>
  </form>
</div>
<script>
  function updateWeight() {
    const sel = document.getElementById('animalSelect');
    const opt = sel.options[sel.selectedIndex];
    const w = opt.dataset.weight;
    if (w) document.getElementById('weightField').value = w;
    calcTotal();
  }
  function calcTotal() {
    const weight   = parseFloat(document.querySelector('[name=weight_at_sale]').value) || 0;
    const rate     = parseFloat(document.querySelector('[name=rate_per_kg]').value)    || 0;
    const expenses = parseFloat(document.querySelector('[name=expenses]').value)       || 0;
    const total    = (weight * rate) + expenses;
    document.getElementById('totalDisplay').value = total > 0 ? 'Rs. ' + total.toLocaleString() : '';
  }
  document.querySelector('[name=weight_at_sale]').addEventListener('input', calcTotal);
</script>
{% endblock %}
