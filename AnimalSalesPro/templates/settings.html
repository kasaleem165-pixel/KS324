{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:480px; margin:0 auto;">
  <h2>Default Settings</h2>
  <p style="color:#666; font-size:.88rem; margin-bottom:18px;">
    These defaults are pre-filled when you record a new sale. You can override them per sale.
  </p>
  <form method="POST">
    <div style="display:flex; flex-direction:column; gap:14px;">
      <div class="form-group">
        <label>Default Rate per kg (Rs.)</label>
        <input name="rate_per_kg" type="number" step="1" required value="{{ rate }}">
        <span class="hint">Current: Rs. {{ "{:,.0f}".format(rate) }}/kg</span>
      </div>
      <div class="form-group">
        <label>Default Expenses per Animal (Rs.)</label>
        <input name="expenses_default" type="number" step="1" required value="{{ expenses }}">
        <span class="hint">Admin charges, transport, etc.</span>
      </div>
      <button type="submit" class="btn btn-primary" style="margin-top:6px;">Save Settings</button>
    </div>
  </form>
</div>
{% endblock %}
